<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e6b5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruqya">
<title>Ruqya qəbulu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Onest:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-screen phone app. Fixed header and bottom tabs, a scrolling
   list between them, forms slide up as a bottom sheet. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#16211e; --muted:#5f6e69; --line:#dbe2df;
  --accent:#0e6b5b; --accent-ink:#ffffff; --accent-soft:#dff0ec;
  --ok:#1b7a48; --ok-soft:#def2e6; --warn:#a86200; --warn-soft:#fbecd2; --bad:#b0352d; --bad-soft:#f9e1de;
  --font-display:"Onest","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#18201e; --ink:#e6eeeb; --muted:#93a39e; --line:#2a3633;
    --accent:#4bbfa8; --accent-ink:#06211c; --accent-soft:#17332e;
    --ok:#5fcf8f; --ok-soft:#173224; --warn:#e7ad52; --warn-soft:#3a2c12; --bad:#f08b82; --bad-soft:#3d1e1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18201e; --ink:#e6eeeb; --muted:#93a39e; --line:#2a3633;
  --accent:#4bbfa8; --accent-ink:#06211c; --accent-soft:#17332e;
  --ok:#5fcf8f; --ok-soft:#173224; --warn:#e7ad52; --warn-soft:#3a2c12; --bad:#f08b82; --bad-soft:#3d1e1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.top{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.top h1{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0;text-wrap:balance}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}

.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.daynav{display:flex;align-items:center;gap:8px}
.daynav .label{flex:1;font-family:var(--font-display);font-weight:600;font-size:17px;min-width:0}
.daynav .label small{display:block;font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;flex:none}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:500}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.tile b{display:block;font-family:var(--font-display);font-size:19px;font-weight:700;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.main span{color:inherit;opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--line)}
.card.paid{border-left-color:var(--ok)}
.card.cancel{border-left-color:var(--bad)}
.card.noshow{border-left-color:var(--warn)}
.card.wait{border-left-color:var(--accent)}
.card .row{display:flex;gap:12px;align-items:flex-start}
.card .time{font-family:var(--font-display);font-weight:700;font-size:18px;flex:none;width:52px}
.card .who{flex:1;min-width:0}
.card .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.card .who span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.card .price{font-weight:600;flex:none;text-align:right}
.card.cancel .price,.card.noshow .price{color:var(--muted);text-decoration:line-through}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{border-radius:11px;padding:10px 12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.actions .go{flex:1 1 100%;background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme="dark"] .actions .go{color:#06210f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .actions .go{color:#06210f}}
.actions .half{flex:1}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.cancel{background:var(--bad-soft);color:var(--bad)}
.pill.noshow{background:var(--warn-soft);color:var(--warn)}
.link{background:none;border:0;padding:6px 4px;font-size:14px;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.spacer{flex:1}

.fab{flex:none;margin:8px 16px 10px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;font-weight:600;font-size:16px}
.shell{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r)}
.note{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.note p{margin:0;flex:1}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.pay{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.pay .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pay .head b{font-family:var(--font-display);font-size:17px;overflow-wrap:anywhere}
.pay .head span{font-size:13px;color:var(--muted);flex:none}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div span{display:block;font-size:12px;color:var(--muted)}
.split div b{font-size:18px;font-weight:600}
.split div:last-child{text-align:right}
.pay .foot{font-size:13px;color:var(--muted)}

.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center}
.reader div{flex:1;min-width:0}
.reader b{display:block;font-weight:600;overflow-wrap:anywhere}
.reader span{font-size:13px;color:var(--muted)}
.primary{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:13px 16px;font-weight:600;font-size:16px}
.danger{border:1px solid var(--bad);color:var(--bad);background:none;border-radius:12px;padding:13px 16px;font-weight:600}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h2{font-family:var(--font-display);font-size:19px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:14px;font-weight:500;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .primary{flex:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;min-width:0}
.wd span{font-size:11px;color:var(--muted)}
.wd b{font-size:15px;font-weight:600}
.wd i{font-style:normal;font-size:11px;min-height:15px;color:var(--accent);font-weight:600}
.wd.today b{text-decoration:underline;text-underline-offset:3px}
.wd[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.wd[aria-pressed="true"] span,.wd[aria-pressed="true"] b,.wd[aria-pressed="true"] i{color:var(--accent-ink)}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.slot{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 0;font-size:13px;font-variant-numeric:tabular-nums}
.slot:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
a.link{display:inline-block}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.more summary{padding:12px 14px;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer}
.morebody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.sheet details.more{background:var(--bg)}
h3.sec{font-family:var(--font-display);font-size:15px;margin:8px 0 0;color:var(--muted);font-weight:600}
.visit b{flex:none}
.note.warnbox{background:var(--warn-soft);color:var(--warn);font-weight:500}
[hidden]{display:none!important}
.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;min-height:150px;font:inherit;color:inherit;resize:vertical}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.memo{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere}
a.wa{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;padding:10px 12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--accent);text-decoration:none;flex:1}
.settle{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.settle span{flex:1}
.settle.due b{color:var(--warn)}
.settle.done{color:var(--ok);font-weight:500}
.search{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;width:100%;min-height:46px}
#plist{display:flex;flex-direction:column;gap:12px}
.reader button.open{all:unset;cursor:pointer;flex:1;min-width:0;display:block}
.visit{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.visit span:first-child{flex:1;min-width:0}
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <div class="top" id="top"></div>
    <main id="main"></main>
    <button class="fab" id="fab" data-act="new-appt" hidden>+ Yaz</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Bölmələr" hidden>
    <button data-act="tab" data-tab="day"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Qəbullar</button>
    <button data-act="tab" data-tab="cash"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.2c-.5-.9-1.5-1.4-2.8-1.4-1.7 0-2.9.8-2.9 2.1 0 3 5.9 1.3 5.9 4.3 0 1.3-1.3 2.1-3 2.1-1.4 0-2.5-.6-3-1.6M12 6v12"/></svg>Kassa</button>
    <button data-act="tab" data-tab="patients"><svg viewBox="0 0 24 24"><path d="M6 3.5h9l4 4V20.5H6z"/><path d="M9.5 12h6M9.5 16h6M9.5 8h3"/></svg>Pasiyentlər</button>
    <button data-act="tab" data-tab="readers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 19.5c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5M16 5.3a3.5 3.5 0 0 1 0 6.400M18.5 14.6c1.7.8 2.7 2.5 3 4.900"/></svg>Ayarlar</button>
  </nav>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
var SB_URL="https://ldkhdeehrrajvgrtieal.supabase.co";
var SB_KEY="sb_publishable_HgWeQpSVqGfOdPKOWkwUBg_L67kK0O7";
var ST={wait:"Gözlənilir",paid:"Gəldi və ödədi",cancel:"Ləğv etdi",noshow:"Gəlmədi"};
var MON=["yanvar","fevral","mart","aprel","may","iyun","iyul","avqust","sentyabr","oktyabr","noyabr","dekabr"];
var WDF=["Bazar","Bazar ertəsi","Çərşənbə axşamı","Çərşənbə","Cümə axşamı","Cümə","Şənbə"];
var WD=["B.e","Ç.a","Ç","C.a","C","Ş","B"];
var IN_APP=/RuqyaApp/.test(navigator.userAgent);
var CLOSE='<button class="icon-btn" data-act="close" aria-label="Bağla">×</button>';

/* ---------- helpers ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function uuid(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16)});
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return (Math.round((+n||0)*100)/100).toLocaleString("ru-RU",{maximumFractionDigits:2})+" ₼"}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fmtDay(s,mode){
  var d=parse(s),base=d.getDate()+" "+MON[d.getMonth()];
  if(mode==="w")return WDF[d.getDay()]+", "+base;
  if(mode==="y")return base+" "+d.getFullYear();
  return base;
}
function digits(p){var d=String(p||"").replace(/\D/g,"");return d.length>=9?d.slice(-9):d}
function byId(id){return document.getElementById(id)}
function val(id){var e=byId(id);return e?e.value.trim():""}
function fail(id,msg){var e=byId(id);if(e){e.textContent=msg;e.hidden=false}}

/* ---------- state ---------- */
var today=iso(new Date());
var ui={tab:"day",date:today,filter:"all",period:"day",q:""};
var sheet=null;
var sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
function blank(){return{readers:[],appts:[],services:[],expenses:[],staff:{},v2:false}}
var state=blank();
var auth={user:null,ready:false,loaded:false,msg:""};
var offline=false,seq=0,rt=null,rtTimer=null,msgTimer=null;

function flash(m){
  auth.msg=m;render();clearTimeout(msgTimer);
  if(m)msgTimer=setTimeout(function(){auth.msg="";render()},7000);
}
function fetchAll(make){
  var out=[],from=0;
  function next(){return make().range(from,from+999).then(function(r){
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(r.data&&r.data.length===1000){from+=1000;return next()}
    return out;
  })}
  return next();
}
function soft(make){return fetchAll(make).then(function(d){return d},function(){return null})}
function refresh(){
  if(!sb||!auth.user)return Promise.resolve();
  var my=++seq,since=addDays(today,-400);
  return Promise.all([
    fetchAll(function(){return sb.from("readers").select("*").order("created_at").order("id")}),
    fetchAll(function(){return sb.from("appts").select("*").gte("date",since).order("date",{ascending:false}).order("id")}),
    soft(function(){return sb.from("services").select("*").order("created_at").order("id")}),
    soft(function(){return sb.from("expenses").select("*").gte("date",since).order("date",{ascending:false}).order("id")}),
    soft(function(){return sb.from("staff").select("*").order("id")})
  ]).then(function(res){
    if(my!==seq||!auth.user)return;
    state.readers=res[0].map(function(x){return{id:x.id,name:x.name,price:+x.price,share:+x.share,archived:!!x.archived}});
    state.appts=res[1].map(function(x){return{id:x.id,readerId:x.reader_id,date:x.date,time:String(x.time||"").slice(0,5),name:x.name||"",phone:x.phone||"",price:+x.price,share:+x.share,status:ST[x.status]?x.status:"wait",note:x.note||"",settled:!!x.settled,service:svcName(x.service),by:x.created_by||""}});
    state.v2=!!(res[2]&&res[3]&&res[4]);
    state.services=(res[2]||[]).map(function(x){return{id:x.id,name:svcName(x.name)}});
    state.expenses=(res[3]||[]).map(function(x){return{id:x.id,date:x.date,title:x.title||"",amount:+x.amount||0,by:x.created_by||""}});
    state.staff={};(res[4]||[]).forEach(function(x){state.staff[x.id]=x.name});
    auth.loaded=true;render();
    if(state.v2&&!state.staff[auth.user.id]&&!sheet&&!auth.asked){auth.asked=true;openSheet({type:"me"})}
  },function(){
    if(my===seq)flash(offline?"İnternet yoxdur.":"Qəbulları yükləmək olmadı. İnterneti yoxlayın.");
  });
}
function db(q){
  return q.then(function(r){
    if(r.error)flash(r.error.code==="23505"?"Bu saat artıq tutulub. Başqa saat seçin.":"Yadda saxlanmadı. Yenidən cəhd edin.");
    return refresh();
  },function(){flash("Serverlə əlaqə yoxdur. Dəyişiklik yadda saxlanmadı.");return refresh()});
}
function startSync(){
  refresh();
  if(rt||!sb)return;
  try{
    rt=sb.channel("all").on("postgres_changes",{event:"*",schema:"public"},function(){
      clearTimeout(rtTimer);rtTimer=setTimeout(refresh,300);
    }).subscribe();
  }catch(e){rt=null}
}
function stopSync(){
  if(rt&&sb){try{sb.removeChannel(rt)}catch(e){}rt=null}
  state=blank();auth.loaded=false;auth.asked=false;seq++;
}

function reader(id){for(var i=0;i<state.readers.length;i++)if(state.readers[i].id===id)return state.readers[i];return null}
function appt(id){for(var i=0;i<state.appts.length;i++)if(state.appts[i].id===id)return state.appts[i];return null}
function expense(id){for(var i=0;i<state.expenses.length;i++)if(state.expenses[i].id===id)return state.expenses[i];return null}
function r2(n){return Math.round((+n||0)*100)/100}
function svcName(n){n=n||"Ruqya";return n==="Ruqy\u0259"?"Ruqya":n==="Hicam\u0259"?"Hicama":n}
function activeReaders(){return state.readers.filter(function(r){return !r.archived})}
function split(a){var m=a.price*a.share/100;return{mgr:m,rd:a.price-m}}
function range(){
  var d=parse(ui.date),s,e;
  if(ui.period==="day"){s=e=ui.date}
  else if(ui.period==="week"){s=addDays(ui.date,-((d.getDay()+6)%7));e=addDays(s,6)}
  else{s=iso(new Date(d.getFullYear(),d.getMonth(),1));e=iso(new Date(d.getFullYear(),d.getMonth()+1,0))}
  return{s:s,e:e};
}
function pkey(a){var d=digits(a.phone);return d.length>=7?"p"+d:"n"+String(a.name).trim().toLowerCase()}
function patients(){
  var m={};
  state.appts.forEach(function(a){
    var k=pkey(a),p=m[k]||(m[k]={key:k,name:a.name,phone:a.phone,paid:0,noshow:0,cancel:0,wait:0,last:"",first:"",list:[]});
    p[a.status]++;p.list.push(a);
    if(a.status==="paid"&&(!p.first||a.date<p.first))p.first=a.date;
    if(a.date>=p.last){p.last=a.date;p.name=a.name;if(a.phone)p.phone=a.phone}
  });
  return m;
}
function waLink(phone,text){
  var d=String(phone||"").replace(/\D/g,"");
  if(d.length===10&&d.charAt(0)==="0")d="994"+d.slice(1);
  else if(d.length===9)d="994"+d;
  if(d.length<11)return "";
  return "https://wa.me/"+d+(text?"?text="+encodeURIComponent(text):"");
}
function remindText(a){return "Salam! Qəbulunuzu xatırladırıq: "+fmtDay(a.date)+", saat "+a.time+(state.v2?" ("+a.service+")":"")+". Zəhmət olmasa, gələcəyinizi təsdiqləyin."}

/* ---------- render ---------- */
function render(){
  var top=byId("top"),main=byId("main"),gate=!auth.user;
  byId("tabs").hidden=gate;
  byId("fab").hidden=gate||ui.tab!=="day"||!activeReaders().length;
  if(gate){
    if(byId("l-mail")&&auth.ready&&sb){var le=byId("l-err");le.textContent=auth.msg;le.hidden=!auth.msg;return}
    top.innerHTML="<h1>Ruqya qəbulu</h1>";
    main.innerHTML=!sb?'<div class="empty">Proqram yüklənmədi. İnterneti yoxlayın və səhifəni yenidən açın.</div>'
      :!auth.ready?'<div class="empty">Yüklənir…</div>'
      :'<div class="field"><label for="l-mail">E-poçt</label><input id="l-mail" type="email" autocomplete="username" inputmode="email" autocapitalize="off"></div>'+
       '<div class="field"><label for="l-pass">Şifrə</label><input id="l-pass" type="password" autocomplete="current-password"></div>'+
       '<p class="err" id="l-err" hidden></p><button class="primary" data-act="login">Daxil ol</button>'+
       '<p class="hint">E-poçt və şifrəni rəhbər verir.</p>';
    return;
  }
  var tabs=document.querySelectorAll("#tabs button");
  for(var i=0;i<tabs.length;i++){if(tabs[i].dataset.tab===ui.tab)tabs[i].setAttribute("aria-current","page");else tabs[i].removeAttribute("aria-current")}
  var note=offline?"İnternet yoxdur. Dəyişikliklər yadda saxlanmayacaq.":auth.msg;
  var banner=note?'<div class="note warnbox"><p>'+esc(note)+'</p></div>':(!auth.loaded?'<div class="note"><p>Qəbullar yüklənir…</p></div>':"");
  if(ui.tab==="patients"){
    if(!byId("q"))top.innerHTML='<h1>Pasiyentlər</h1><input class="search" id="q" type="search" placeholder="Ad və ya telefon ilə axtar" value="'+esc(ui.q)+'">';
    main.innerHTML=banner+'<div id="plist">'+patientsList()+'</div>';
    return;
  }
  if(ui.tab==="day"){top.innerHTML=dayTop();main.innerHTML=banner+dayMain()}
  else if(ui.tab==="cash"){top.innerHTML=cashTop();main.innerHTML=banner+cashMain()}
  else{top.innerHTML="<h1>Ayarlar</h1>";main.innerHTML=banner+readersMain()}
}

function navHtml(title,small){
  return '<div class="daynav">'+
    '<button class="icon-btn" data-act="shift" data-n="-1" aria-label="Geri">‹</button>'+
    '<div class="label">'+esc(title)+'<small>'+esc(small)+'</small></div>'+
    (ui.date===today?'':'<button class="ghost" data-act="today">Bu gün</button>')+
    '<button class="icon-btn" data-act="shift" data-n="1" aria-label="İrəli">›</button></div>';
}

function dayTop(){
  var h=navHtml(fmtDay(ui.date,"w"),ui.date===today?"Bu gün":parse(ui.date).getFullYear()+"-ci il");
  var rs=activeReaders();
  if(rs.length>1){
    h+='<div class="chips"><button class="chip" data-act="filter" data-id="all" aria-pressed="'+(ui.filter==="all")+'">Hamısı</button>';
    rs.forEach(function(r){h+='<button class="chip" data-act="filter" data-id="'+esc(r.id)+'" aria-pressed="'+(ui.filter===r.id)+'">'+esc(r.name)+'</button>'});
    h+='</div>';
  }
  var mon=addDays(ui.date,-((parse(ui.date).getDay()+6)%7)),cnt={};
  state.appts.forEach(function(a){if(a.status!=="cancel"&&(ui.filter==="all"||a.readerId===ui.filter))cnt[a.date]=(cnt[a.date]||0)+1});
  h+='<div class="week">';
  for(var i=0;i<7;i++){var d=addDays(mon,i);
    h+='<button class="wd'+(d===today?" today":"")+'" data-act="goto" data-d="'+d+'" aria-pressed="'+(d===ui.date)+'" aria-label="'+fmtDay(d)+'"><span>'+WD[i]+'</span><b class="num">'+parse(d).getDate()+'</b><i class="num">'+(cnt[d]||"")+'</i></button>'}
  return h+'</div>';
}

function dayMain(){
  var h="";
  if(!activeReaders().length){
    return auth.loaded?'<div class="empty"><p>Əvvəlcə mütəxəssis əlavə edin: ad, seansın qiyməti və rəhbərin payı.</p><button class="primary" data-act="new-reader">Mütəxəssis əlavə et</button></div>':"";
  }
  var late=state.appts.filter(function(a){return a.date<today&&a.status==="wait"});
  if(late.length){
    var first=late.reduce(function(m,a){return a.date<m?a.date:m},late[0].date);
    h+='<div class="note warnbox"><p>Keçmiş günlərdə statusu seçilməmiş qəbul: '+late.length+'. Seçilməyincə kassa natamam qalır.</p>'+
      (first!==ui.date?'<button class="ghost" data-act="goto" data-d="'+first+'">Göstər</button>':'')+'</div>';

  var list=state.appts.filter(function(a){return a.date===ui.date&&(ui.filter==="all"||a.readerId===ui.filter)})
    .sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0});

    '<div class="tile"><b class="num">'+paid.length+'</b><span>gəldi</span></div>'+
    '<div class="tile main"><b class="num">'+money(sum)+'</b><span>kassada</span></div></div>';
  if(!list.length)return h+'<div class="empty">Bu günə qəbul yoxdur. Pasiyent yazmaq üçün «Yaz» düyməsini basın.</div>';
  var pm=patients(),dup={};
  list.forEach(function(a){if(a.status!=="cancel"){var k=a.readerId+"|"+a.time;dup[k]=(dup[k]||0)+1}});
  list.forEach(function(a){
    var r=reader(a.readerId),p=pm[pkey(a)];

    if(was>0)tags+='<span class="tag">'+was+' dəfə gəlib</span>';
    if(miss>0)tags+='<span class="tag warn">'+miss+' dəfə gəlməyib</span>';
    h+='<div class="card '+a.status+'"><div class="row">'+
      '<div class="time num">'+esc(a.time)+'</div>'+
      '<div class="who"><b>'+esc(a.name)+'</b><span>'+(state.v2?esc(a.service)+' · ':'')+esc(r?r.name:"—")+(a.phone?' · '+esc(a.phone):'')+'</span></div>'+
      '<div class="price num">'+money(a.price)+'</div></div>';
    if(tags)h+='<div class="tags">'+tags+'</div>';
    if(a.note)h+='<p class="memo">'+esc(a.note)+'</p>';
    if(a.status==="wait"){
      var wa=waLink(a.phone,remindText(a));
      h+='<div class="actions">'+
        '<button class="go" data-act="status" data-id="'+esc(a.id)+'" data-st="paid">Gəldi və ödədi</button>'+
        '<button class="half" data-act="status" data-id="'+esc(a.id)+'" data-st="cancel">Ləğv etdi</button>'+
        '<button class="half" data-act="status" data-id="'+esc(a.id)+'" data-st="noshow">Gəlmədi</button></div>'+
        '<div class="links"><button class="link" data-act="edit-appt" data-id="'+esc(a.id)+'">Dəyiş</button>'+
        (wa?'<a class="link" href="'+esc(wa)+'" target="_blank" rel="noopener">WhatsApp-da xatırlat</a>':'')+'</div>';
    }else{
      h+='<div class="status"><span class="pill '+a.status+'">'+ST[a.status]+'</span><span class="spacer"></span>'+
        '<button class="link" data-act="status" data-id="'+esc(a.id)+'" data-st="wait">Geri qaytar</button>'+
        '<button class="link" data-act="edit-appt" data-id="'+esc(a.id)+'">Dəyiş</button></div>';

function periodTitle(){
  var r=range(),d=parse(ui.date);
  if(ui.period==="day")return fmtDay(ui.date,"y");
  if(ui.period==="week")return fmtDay(r.s)+" – "+fmtDay(r.e);
  return cap(MON[d.getMonth()])+" "+d.getFullYear();
}
function cashTop(){
  var title=ui.period==="day"?fmtDay(ui.date,"w"):periodTitle();
  var small=ui.period==="day"?(ui.date===today?"Bu gün":"Günlük kassa"):ui.period==="week"?"Həftəlik kassa":"Aylıq kassa";
  var seg='<div class="seg">';
  [["day","Gün"],["week","Həftə"],["month","Ay"]].forEach(function(p){seg+='<button data-act="period" data-p="'+p[0]+'" aria-pressed="'+(ui.period===p[0])+'">'+p[1]+'</button>'});
  return seg+'</div>'+navHtml(title,small);
}
function cashData(){
  var r=range(),rows={},order=[];
  state.readers.forEach(function(x){rows[x.id]={name:x.name,n:0,sum:0,mgr:0,rd:0,due:0,cancel:0,noshow:0,wait:0};order.push(x.id)});
  state.appts.forEach(function(a){
    if(a.date<r.s||a.date>r.e)return;
    var row=rows[a.readerId];if(!row)return;
    if(a.status==="paid"){var s=split(a);row.n++;row.sum+=a.price;row.mgr+=s.mgr;row.rd+=s.rd;if(!a.settled)row.due+=s.mgr}
    else row[a.status]++;
  });
  var T={n:0,sum:0,mgr:0,rd:0,due:0,cancel:0,noshow:0};
  order.forEach(function(id){var x=rows[id];for(var k in T)T[k]+=x[k]});
  return{r:r,rows:rows,order:order,T:T};
}
function reportText(){
  var d=cashData(),T=d.T,t="Kassa: "+periodTitle()+"\nCəmi: "+money(T.sum)+" ("+T.n+" seans)\n";
  d.order.forEach(function(id){var x=d.rows[id];if(!x.n)return;
    t+="\n"+x.name+": "+x.n+" seans, "+money(x.sum)+"\n  mütəxəssisə "+money(x.rd)+"\n"});
  t+="\nMütəxəssislərə: "+money(T.rd);
  if(T.cancel||T.noshow)t+="\nLəğv etdi: "+T.cancel+", gəlmədi: "+T.noshow;
  return t;
}
function cashMain(){
  var d=cashData(),rows=d.rows,T=d.T,shown=0;
  var h='<div class="strip">'+
    '<div class="tile main"><b class="num">'+money(T.sum)+'</b><span>cəmi kassada</span></div>'+
    '<div class="tile"><b class="num">'+money(T.rd)+'</b><span>mütəxəssislərə</span></div>'+
    '<div class="tile"><b class="num">'+T.n+'</b><span>seans</span></div></div>';
  d.order.forEach(function(id){
    var x=rows[id],rd=reader(id),any=x.n+x.cancel+x.noshow+x.wait;
    if(rd.archived&&!any)return;
    shown++;
    var pct=x.sum?Math.round(x.rd/x.sum*100):0,foot=[];
    if(x.wait)foot.push("gözlənilir: "+x.wait);
    if(x.cancel)foot.push("ləğv etdi: "+x.cancel);
    if(x.noshow)foot.push("gəlmədi: "+x.noshow);
    h+='<div class="pay"><div class="head"><b>'+esc(x.name)+'</b><span class="num">'+x.n+' seans · '+money(x.sum)+'</span></div>'+
      '<div class="settle" style="border-top:0;padding-top:0"><span>Mütəxəssisə</span><b class="num">'+money(x.rd)+'</b></div>'+
      (foot.length?'<div class="foot">'+cap(foot.join(", "))+'</div>':'')+
      '</div>';
  });
  if(!shown)return h+(auth.loaded?'<div class="empty">Hələ mütəxəssis yoxdur. «Mütəxəssislər» bölməsində əlavə edin.</div>':"");
  var fin=T.n+T.cancel+T.noshow,more="";
  if(state.v2){
    var ex=expensesIn(d.r),exSum=ex.reduce(function(t,x){return t+x.amount},0);
    h+='<div class="pay"><div class="head"><b>Xərclər</b><span class="num">'+money(exSum)+'</span></div>';
    if(ex.length){h+='<div>';ex.forEach(function(x){
      h+='<div class="visit"><span>'+fmtDay(x.date)+' · '+esc(x.title)+'</span><b class="num">'+money(x.amount)+'</b><button class="link" data-act="edit-expense" data-id="'+esc(x.id)+'">Dəyiş</button></div>'});h+='</div>'}
    h+='<button class="ghost" data-act="new-expense">Xərc əlavə et</button>'+
      '</div>';
    var PN={day:"günlük",week:"həftəlik",month:"aylıq"}[ui.period];
    h+='<button class="primary" data-act="xlsx">Excel hesabatı ('+PN+')</button>';
    h+='<button class="ghost" data-act="stats">Statistika: kimin yazdığı neçə pasiyent gəlib</button>';
  }
  if(ui.period!=="day"){
    var pm=patients(),nw=0,rp=0,days={};
    state.appts.forEach(function(a){
      if(a.status!=="paid"||a.date<d.r.s||a.date>d.r.e)return;
      days[a.date]=1;if(pm[pkey(a)].first===a.date)nw++;else rp++;
    });
    var nd=Object.keys(days).length;
    more+='<div class="stats"><div class="tile"><b class="num">'+nw+'</b><span>yeni pasiyent</span></div>'+
      '<div class="tile"><b class="num">'+rp+'</b><span>təkrar gəliş</span></div>'+
      '<div class="tile"><b class="num">'+nd+'</b><span>iş günü</span></div>'+
      '<div class="tile"><b class="num">'+money(nd?T.sum/nd:0)+'</b><span>gündə orta</span></div></div>';
  }
  more+='<button class="ghost" data-act="report">Hesabatı mətn kimi göndər</button>';
  h+='<details class="more"'+(ui.more?" open":"")+'><summary>Əlavə</summary><div class="morebody">'+more+'</div></details>';
  h+='<p class="hint">'+(fin?'Gələnlər: '+T.n+' / '+fin+' ('+Math.round(T.n/fin*100)+'%). ':'')+'Hesaba yalnız «Gəldi və ödədi» seçilmiş seanslar düşür.</p>';
  return h;
}
function expensesIn(r){
  return state.expenses.filter(function(x){return x.date>=r.s&&x.date<=r.e})
    .sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
}
function statsData(){
  var r=range(),by={},seen={},tot={name:"Cəmi",n:0,paid:0,s:{}};
  state.appts.forEach(function(a){
    if(a.status!=="paid"||a.date<r.s||a.date>r.e)return;
    var k=a.by||"",row=by[k]||(by[k]={name:state.staff[k]||"Adsız istifadəçi",n:0,paid:0,s:{}});
    [row,tot].forEach(function(x){x.n++;x.s[a.service]=(x.s[a.service]||0)+1});
    seen[a.service]=1;
  });
  var svc=state.services.map(function(x){return x.name}).filter(function(n){return seen[n]});
  Object.keys(seen).forEach(function(n){if(svc.indexOf(n)<0)svc.push(n)});
  return{rows:Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return b.n-a.n}),svc:svc,tot:tot};
}
function statsSheet(){
  var d=statsData(),h='<h2>Statistika'+CLOSE+'</h2><p class="hint">'+esc(periodTitle())+'. Yalnız gəlib ödəyən pasiyentlər sayılır.</p>';
  if(!d.tot.n)return h+'<div class="empty">Bu dövrdə gələn pasiyent yoxdur.</div>';
  [d.tot].concat(d.rows).forEach(function(x,i){
    h+='<div class="pay"><div class="head"><b>'+esc(x.name)+'</b><span class="num">'+x.n+' pasiyent</span></div><div class="tags">'+
      d.svc.map(function(n){return '<span class="tag">'+esc(n)+': '+(x.s[n]||0)+'</span>'}).join("")+'</div></div>';
  });
  return h;
}
function loadXlsx(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise(function(ok,no){
    var sc=document.createElement("script");
    sc.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    sc.onload=function(){window.XLSX?ok(window.XLSX):no()};sc.onerror=no;
    document.head.appendChild(sc);
  });
}
function reportBook(){
  var r=range(),d=cashData(),T=d.T,ex=expensesIn(r),exSum=ex.reduce(function(t,x){return t+x.amount},0),st=statsData();
  var sum=[["Hesabat",periodTitle()],["Dövr",r.s+" — "+r.e],[],
    ["Kassa cəmi",r2(T.sum)],["Mütəxəssislərə",r2(T.rd)],["Xərclər",r2(exSum)],[],
    ["Mütəxəssis","Seans","Kassa","Mütəxəssisə","Ləğv etdi","Gəlmədi"]];
  d.order.forEach(function(id){var x=d.rows[id];if(x.n+x.cancel+x.noshow)sum.push([x.name,x.n,r2(x.sum),r2(x.rd),x.cancel,x.noshow])});
  var bs={},bo=[];
  state.appts.forEach(function(a){if(a.status!=="paid"||a.date<r.s||a.date>r.e)return;
    if(!bs[a.service]){bs[a.service]={n:0,sum:0};bo.push(a.service)}bs[a.service].n++;bs[a.service].sum+=a.price});
  sum.push([],["Xidmət","Seans","Məbləğ"]);
  bo.forEach(function(n){sum.push([n,bs[n].n,r2(bs[n].sum)])});
  var ap=[["Tarix","Saat","Xidmət","Mütəxəssis","Pasiyent","Telefon","Qiymət","Status","Mütəxəssisə","Yazan","Qeyd"]];
  state.appts.filter(function(a){return a.date>=r.s&&a.date<=r.e})
    .sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)})
    .forEach(function(a){var rd=reader(a.readerId),sp=a.status==="paid"?split(a):{rd:0,mgr:0};
      ap.push([a.date,a.time,a.service,rd?rd.name:"",a.name,a.phone,r2(a.price),ST[a.status],r2(sp.rd),state.staff[a.by]||"",a.note])});
  var xp=[["Tarix","Xərc","Məbləğ","Yazan"]];
  ex.forEach(function(x){xp.push([x.date,x.title,r2(x.amount),state.staff[x.by]||""])});
  xp.push([],["Cəmi","",r2(exSum)]);
  var sx=[["Yazan","Gələn pasiyent"].concat(st.svc)];
  st.rows.concat([st.tot]).forEach(function(x){sx.push([x.name,x.n].concat(st.svc.map(function(n){return x.s[n]||0})))});
  return{name:"hesabat_"+r.s+(r.e!==r.s?"_"+r.e:"")+".xlsx",sheets:[["Yekun",sum,[24,14,12,14,12,12]],["Qəbullar",ap,[11,7,12,16,22,16,9,16,12,14,24]],["Xərclər",xp,[11,30,12,16]],["Statistika",sx,[22,14,12,12,12,12]]]};
}
function downloadXlsx(){
  if(IN_APP&&!(window.RuqyaNative&&window.RuqyaNative.saveFile)){flash("Excel üçün proqramın yeni versiyasını quraşdırın.");return}
  flash("Excel hazırlanır…");
  loadXlsx().then(function(X){
    var rb=reportBook(),wb=X.utils.book_new();
    rb.sheets.forEach(function(sh){
      var ws=X.utils.aoa_to_sheet(sh[1]);ws["!cols"]=sh[2].map(function(w){return{wch:w}});
      X.utils.book_append_sheet(wb,ws,sh[0]);
    });
    if(window.RuqyaNative&&window.RuqyaNative.saveFile){window.RuqyaNative.saveFile(rb.name,X.write(wb,{bookType:"xlsx",type:"base64"}));flash("");return}
    var blob=new Blob([X.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=rb.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},5000);flash("");

function slotGrid(){
  var el=byId("f-busy"),box=byId("f-slots");if(!el||!box||!sheet)return;
  var rid=val("f-reader"),date=val("f-date"),cur=val("f-time");
  var t=state.appts.filter(function(x){return x.readerId===rid&&x.date===date&&x.status!=="cancel"&&x.id!==sheet.id}).map(function(x){return x.time}).sort();
  var h="";
  for(var m=9*60;m<=21*60;m+=30){
    var tm=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"),busy=t.indexOf(tm)>=0;
    h+='<button type="button" class="slot" data-act="slot" data-t="'+tm+'"'+(busy?" disabled":"")+' aria-pressed="'+(tm===cur)+'">'+tm+'</button>';
  }
  box.innerHTML=h;
  el.textContent=t.length?"Üstündən xətt çəkilmiş saatlar tutulub: "+t.join(", ")+".":"Bu gün bütün saatlar boşdur.";
}

function saveAppt(){
  if(!sheet)return;
  var rid=val("f-reader"),date=val("f-date"),time=val("f-time").slice(0,5),name=val("f-name"),phone=val("f-phone"),price=parseFloat(val("f-price")),note=val("f-note");
  var r=reader(rid),service=state.v2?val("f-service"):"";
  if(!r)return fail("f-err","Mütəxəssisi seçin.");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return fail("f-err","Tarixi seçin.");
  if(!/^\d{2}:\d{2}$/.test(time))return fail("f-err","Saatı seçin.");
  if(!name)return fail("f-err","Pasiyentin adını yazın.");
  if(isNaN(price)||price<0)return fail("f-err","Qiyməti yazın.");
  var a=sheet.id?appt(sheet.id):null;
  if(sheet.id&&!a){closeSheet();flash("Bu qəbul artıq silinib.");return}
  var clash=state.appts.filter(function(x){return x.readerId===rid&&x.date===date&&x.time===time&&x.id!==sheet.id&&x.status!=="cancel"})[0];
  if(clash&&!(a&&a.status==="cancel"))return fail("f-err",r.name+" üçün saat "+time+" artıq tutulub ("+clash.name+"). Başqa saat seçin.");
  if(a){
    if(a.readerId!==rid)a.share=r.share;
    a.readerId=rid;a.date=date;a.time=time;a.name=name;a.phone=phone;a.price=price;a.note=note;
    var up={reader_id:rid,date:date,time:time,name:name,phone:phone,price:price,share:a.share,note:note};
    if(service){a.service=service;up.service=service}
    db(sb.from("appts").update(up).eq("id",a.id));
  }else{
    var id=uuid();
    state.appts.push({id:id,readerId:rid,date:date,time:time,name:name,phone:phone,price:price,share:r.share,status:"wait",note:note,settled:false,service:service||"Ruqya",by:auth.user.id});
    var ins={id:id,reader_id:rid,date:date,time:time,name:name,phone:phone,price:price,share:r.share,status:"wait",note:note};
    if(service)ins.service=service;
    db(sb.from("appts").insert(ins));
  }
  ui.date=date;ui.tab="day";if(ui.filter!=="all"&&ui.filter!==rid)ui.filter="all";
  closeSheet();render();
}
function saveReader(){
  if(!sheet)return;
  var name=val("r-name"),price=parseFloat(val("r-price")),share=parseFloat(val("r-share"));
  if(!name)return fail("r-err","Mütəxəssisin adını yazın.");
  if(isNaN(price)||price<0)return fail("r-err","Seansın qiymətini yazın.");
  if(isNaN(share)||share<0||share>100)return fail("r-err","Rəhbərin payı 0-dan 100%-ə qədər olmalıdır.");
  if(sheet.id){
    var r=reader(sheet.id);
    if(r){r.name=name;r.price=price;r.share=share}
    db(sb.from("readers").update({name:name,price:price,share:share}).eq("id",sheet.id));
  }else{
    var id=uuid();
    state.readers.push({id:id,name:name,price:price,share:share,archived:false});
    db(sb.from("readers").insert({id:id,name:name,price:price,share:share}));
  }
  closeSheet();render();
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  if(e.target.id==="overlay"){closeSheet();return}
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;
  if(act==="login"){
    var mail=val("l-mail").toLowerCase(),pass=byId("l-pass").value;
    if(!mail||!pass){auth.msg="E-poçt və şifrəni yazın.";render();return}
    b.disabled=true;auth.msg="";render();
    sb.auth.signInWithPassword({email:mail,password:pass}).then(function(r){
      b.disabled=false;
      if(r.error){auth.msg=(r.error.status===400||/invalid/i.test(r.error.message||""))?"E-poçt və ya şifrə səhvdir.":"Daxil olmaq alınmadı. Bir az sonra yenidən cəhd edin.";render()}
    },function(){b.disabled=false;auth.msg="Serverlə əlaqə yoxdur. İnterneti yoxlayın.";render()});
    return;
  }
  if(!auth.user)return;
  if(act==="tab"){
    if(ui.tab!==b.dataset.tab){ui.tab=b.dataset.tab;byId("top").innerHTML="";byId("main").scrollTop=0}
  }
  else if(act==="goto"){ui.date=b.dataset.d}
  else if(act==="shift"){
    var n=+b.dataset.n;
    if(ui.tab==="cash"&&ui.period==="week")ui.date=addDays(ui.date,7*n);
    else if(ui.tab==="cash"&&ui.period==="month"){var d=parse(ui.date);ui.date=iso(new Date(d.getFullYear(),d.getMonth()+n,1))}
    else ui.date=addDays(ui.date,n);
  }
  else if(act==="today"){ui.date=today}
  else if(act==="filter"){ui.filter=id}
  else if(act==="period"){ui.period=b.dataset.p}
  else if(act==="status"){
    var a=appt(id),st=b.dataset.st;
    if(a&&ST[st]&&a.status!==st){
      a.status=st;if(st!=="paid")a.settled=false;
      db(sb.from("appts").update({status:st,settled:a.settled}).eq("id",a.id));
    }
  }
  else if(act==="settle"||act==="unsettle"){
    var rg=range(),on=act==="settle";
    state.appts.forEach(function(x){if(x.readerId===id&&x.status==="paid"&&x.date>=rg.s&&x.date<=rg.e)x.settled=on});
    db(sb.from("appts").update({settled:on}).eq("reader_id",id).eq("status","paid").gte("date",rg.s).lte("date",rg.e));
  }
  else if(act==="report"){openSheet({type:"report"});return}
  else if(act==="xlsx"){downloadXlsx();return}
  else if(act==="stats"){openSheet({type:"stats"});return}
  else if(act==="me"){openSheet({type:"me"});return}
  else if(act==="new-service"){openSheet({type:"service"});return}
  else if(act==="new-expense"){openSheet({type:"expense",id:null});return}
  else if(act==="edit-expense"){if(expense(id))openSheet({type:"expense",id:id});return}
  else if(act==="save-me"){
    var mn=val("m-name");if(!mn)return fail("m-err","Adınızı yazın.");
    state.staff[auth.user.id]=mn;db(sb.from("staff").upsert({id:auth.user.id,name:mn}));closeSheet();
  }
  else if(act==="save-service"){
    var sv=val("s-name");if(!sv)return fail("s-err","Xidmətin adını yazın.");
    if(state.services.some(function(x){return x.name.toLowerCase()===sv.toLowerCase()}))return fail("s-err","Bu xidmət artıq var.");
    var sid2=uuid();state.services.push({id:sid2,name:sv});db(sb.from("services").insert({id:sid2,name:sv}));closeSheet();
  }
  else if(act==="del-service"){
    if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Bir də basın";return}
    state.services=state.services.filter(function(x){return x.id!==id});db(sb.from("services").delete().eq("id",id));
  }
  else if(act==="save-expense"){
    if(!sheet)return;
    var xt=val("x-title"),xa=parseFloat(val("x-amount")),xd=val("x-date");
    if(!xt)return fail("x-err","Xərcin adını yazın.");
    if(isNaN(xa)||xa<=0)return fail("x-err","Məbləği yazın.");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(xd))return fail("x-err","Tarixi seçin.");
    var xo=sheet.id?expense(sheet.id):null;
    if(xo){xo.title=xt;xo.amount=xa;xo.date=xd;db(sb.from("expenses").update({title:xt,amount:xa,date:xd}).eq("id",xo.id))}
    else{var xid=uuid();state.expenses.push({id:xid,date:xd,title:xt,amount:xa,by:auth.user.id});db(sb.from("expenses").insert({id:xid,date:xd,title:xt,amount:xa}))}
    closeSheet();
  }
  else if(act==="del-expense"){
    if(!sheet)return;
    if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Bir də basın";return}
    var xs=sheet.id;state.expenses=state.expenses.filter(function(x){return x.id!==xs});db(sb.from("expenses").delete().eq("id",xs));closeSheet();
  }
  else if(act==="patient"){openSheet({type:"patient",id:id});return}
  else if(act==="repeat"){
    var pp=patients()[id];
    if(!activeReaders().length){closeSheet();ui.tab="readers";byId("top").innerHTML="";render();return}
    openSheet({type:"appt",id:null,pre:pp?{name:pp.name,phone:pp.phone}:{}});return;
  }
  else if(act==="copy"){
    var ta=byId("rep"),msg=byId("rep-msg");
    var no=function(){ta.focus();ta.select();msg.textContent="Avtomatik kopyalanmadı. Mətn seçilib, özünüz kopyalayın."};
    try{navigator.clipboard.writeText(ta.value).then(function(){msg.textContent="Kopyalandı. WhatsApp-a yapışdırın."},no)}catch(err){no()}
    return;
  }
  else if(act==="slot"){byId("f-time").value=b.dataset.t;slotGrid();return}
  else if(act==="new-appt"){if(activeReaders().length)openSheet({type:"appt",id:null});return}
  else if(act==="edit-appt"){if(appt(id))openSheet({type:"appt",id:id});return}
  else if(act==="new-reader"){openSheet({type:"reader",id:null});return}
  else if(act==="edit-reader"){if(reader(id))openSheet({type:"reader",id:id});return}
  else if(act==="close"){closeSheet();return}
  else if(act==="save-appt"){saveAppt();return}
  else if(act==="save-reader"){saveReader();return}
  else if(act==="del-appt"||act==="del-reader"){
    if(!sheet)return;
    if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Bir də basın";return}
    var sid=sheet.id;
    if(act==="del-appt"){state.appts=state.appts.filter(function(x){return x.id!==sid});db(sb.from("appts").delete().eq("id",sid))}
    else{
      var used=state.appts.some(function(x){return x.readerId===sid}),rr=reader(sid);
      if(used){if(rr)rr.archived=true;db(sb.from("readers").update({archived:true}).eq("id",sid))}
      else{state.readers=state.readers.filter(function(x){return x.id!==sid});
        db(sb.from("readers").delete().eq("id",sid).then(function(r){return r.error?sb.from("readers").update({archived:true}).eq("id",sid):r}))}
      if(ui.filter===sid)ui.filter="all";
    }
    closeSheet();
  }
  else if(act==="logout"){sb.auth.signOut();return}
  else return;
  render();
});
document.addEventListener("toggle",function(e){
  if(e.target.classList&&e.target.classList.contains("more")&&e.target.closest("#main"))ui.more=e.target.open;
},true);
document.addEventListener("input",function(e){
  if(e.target.id==="r-price"||e.target.id==="r-share")readerHint();
  if(e.target.id==="q"){ui.q=e.target.value;var pl=byId("plist");if(pl)pl.innerHTML=patientsList()}
});
document.addEventListener("change",function(e){
  var t=e.target.id;
  if(t==="f-reader"||t==="f-date"||t==="f-time")slotGrid();
  if(t==="f-name"){
    var ph=byId("f-phone"),nm=e.target.value.trim().toLowerCase(),pm=patients();
    if(ph&&!ph.value)Object.keys(pm).some(function(k){if(pm[k].name.toLowerCase()===nm&&pm[k].phone){ph.value=pm[k].phone;return true}return false});
  }
  if(t==="f-reader"&&sheet&&!sheet.id){var r=reader(e.target.value);if(r)byId("f-price").value=r.price}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&(e.target.id==="l-mail"||e.target.id==="l-pass")){var lb=document.querySelector('[data-act="login"]');if(lb)lb.click()}
  if(e.key==="Escape"&&sheet)closeSheet();
});
window.addEventListener("popstate",hideSheet);
window.addEventListener("offline",function(){offline=true;render()});
window.addEventListener("online",function(){offline=false;render();refresh()});
function tick(){
  var t=iso(new Date());
  if(t!==today){if(ui.date===today)ui.date=t;today=t}
  if(auth.user&&!document.hidden&&!offline)refresh();
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
setInterval(tick,60000);
if(sb){
  sb.auth.onAuthStateChange(function(ev,sess){
    var was=auth.user&&auth.user.id,now=sess&&sess.user&&sess.user.id;
    auth.user=sess?sess.user:null;auth.ready=true;
    if(now&&now!==was){auth.msg="";setTimeout(startSync,0)}
    if(!now&&was){stopSync();hideSheet();auth.msg="";byId("main").innerHTML="";byId("top").innerHTML=""}
    render();
  });
  setTimeout(function(){if(!auth.ready){auth.ready=true;render()}},8000);
}else{auth.ready=true}
render();
})();
</script>
</body>
</html>
