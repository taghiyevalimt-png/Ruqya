<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e6b5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Рукъя">
<title>Запись на рукъя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Onest:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-screen phone app. Fixed header and bottom tabs, a scrolling
   list between them, forms slide up as a bottom sheet. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#16211e; --muted:#5f6e69; --line:#dbe2df;
  --accent:#0e6b5b; --accent-ink:#ffffff; --accent-soft:#dff0ec;
  --ok:#1b7a48; --ok-soft:#def2e6; --warn:#a86200; --warn-soft:#fbecd2; --bad:#b0352d; --bad-soft:#f9e1de;
  --font-display:"Onest","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#18201e; --ink:#e6eeeb; --muted:#93a39e; --line:#2a3633;
    --accent:#4bbfa8; --accent-ink:#06211c; --accent-soft:#17332e;
    --ok:#5fcf8f; --ok-soft:#173224; --warn:#e7ad52; --warn-soft:#3a2c12; --bad:#f08b82; --bad-soft:#3d1e1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18201e; --ink:#e6eeeb; --muted:#93a39e; --line:#2a3633;
  --accent:#4bbfa8; --accent-ink:#06211c; --accent-soft:#17332e;
  --ok:#5fcf8f; --ok-soft:#173224; --warn:#e7ad52; --warn-soft:#3a2c12; --bad:#f08b82; --bad-soft:#3d1e1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.top{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.top h1{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0;text-wrap:balance}
main{flex:1;overflow-y:auto;padding:4px 16px 96px;display:flex;flex-direction:column;gap:12px}

.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.daynav{display:flex;align-items:center;gap:8px}
.daynav .label{flex:1;font-family:var(--font-display);font-weight:600;font-size:17px;min-width:0}
.daynav .label small{display:block;font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;flex:none}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:500}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.tile b{display:block;font-family:var(--font-display);font-size:19px;font-weight:700;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.main span{color:inherit;opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--line)}
.card.paid{border-left-color:var(--ok)}
.card.cancel{border-left-color:var(--bad)}
.card.noshow{border-left-color:var(--warn)}
.card.wait{border-left-color:var(--accent)}
.card .row{display:flex;gap:12px;align-items:flex-start}
.card .time{font-family:var(--font-display);font-weight:700;font-size:18px;flex:none;width:52px}
.card .who{flex:1;min-width:0}
.card .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.card .who span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.card .price{font-weight:600;flex:none;text-align:right}
.card.cancel .price,.card.noshow .price{color:var(--muted);text-decoration:line-through}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{border-radius:11px;padding:10px 12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.actions .go{flex:1 1 100%;background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme="dark"] .actions .go{color:#06210f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .actions .go{color:#06210f}}
.actions .half{flex:1}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.cancel{background:var(--bad-soft);color:var(--bad)}
.pill.noshow{background:var(--warn-soft);color:var(--warn)}
.link{background:none;border:0;padding:6px 4px;font-size:14px;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.spacer{flex:1}

.fab{position:absolute;right:16px;bottom:76px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;font-weight:600;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.shell{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r)}
.note{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.note p{margin:0;flex:1}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.pay{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.pay .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pay .head b{font-family:var(--font-display);font-size:17px;overflow-wrap:anywhere}
.pay .head span{font-size:13px;color:var(--muted);flex:none}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div span{display:block;font-size:12px;color:var(--muted)}
.split div b{font-size:18px;font-weight:600}
.split div:last-child{text-align:right}
.pay .foot{font-size:13px;color:var(--muted)}

.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center}
.reader div{flex:1;min-width:0}
.reader b{display:block;font-weight:600;overflow-wrap:anywhere}
.reader span{font-size:13px;color:var(--muted)}
.primary{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:13px 16px;font-weight:600;font-size:16px}
.danger{border:1px solid var(--bad);color:var(--bad);background:none;border-radius:12px;padding:13px 16px;font-weight:600}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h2{font-family:var(--font-display);font-size:19px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:14px;font-weight:500;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .primary{flex:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;min-width:0}
.wd span{font-size:11px;color:var(--muted)}
.wd b{font-size:15px;font-weight:600}
.wd i{font-style:normal;font-size:11px;min-height:15px;color:var(--accent);font-weight:600}
.wd.today b{text-decoration:underline;text-underline-offset:3px}
.wd[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.wd[aria-pressed="true"] span,.wd[aria-pressed="true"] b,.wd[aria-pressed="true"] i{color:var(--accent-ink)}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.slot{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 0;font-size:13px;font-variant-numeric:tabular-nums}
.slot:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note.warnbox{background:var(--warn-soft);color:var(--warn);font-weight:500}
[hidden]{display:none!important}
.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;min-height:150px;font:inherit;color:inherit;resize:vertical}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.memo{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere}
a.wa{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;padding:10px 12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--accent);text-decoration:none;flex:1}
.settle{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.settle span{flex:1}
.settle.due b{color:var(--warn)}
.settle.done{color:var(--ok);font-weight:500}
.search{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;width:100%;min-height:46px}
#plist{display:flex;flex-direction:column;gap:12px}
.reader button.open{all:unset;cursor:pointer;flex:1;min-width:0;display:block}
.visit{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.visit span:first-child{flex:1;min-width:0}
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <div class="top" id="top"></div>
    <main id="main"></main>
    <button class="fab" id="fab" data-act="new-appt">+ Записать</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Разделы">
    <button data-act="tab" data-tab="day"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Записи</button>
    <button data-act="tab" data-tab="cash"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.2c-.5-.9-1.5-1.4-2.8-1.4-1.7 0-2.9.8-2.9 2.1 0 3 5.9 1.3 5.9 4.3 0 1.300-1.300 2.100-3 2.100-1.400 0-2.500-.600-3-1.600M12 6v12"/></svg>Касса</button>
    <button data-act="tab" data-tab="patients"><svg viewBox="0 0 24 24"><path d="M6 3.500h9l4 4V20.500H6z"/><path d="M9.500 12h6M9.500 16h6M9.500 8h3"/></svg>Пациенты</button>
    <button data-act="tab" data-tab="readers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.500" r="3.500"/><path d="M2.500 19.500c.500-3.500 3-5.500 6.500-5.500s6 2 6.500 5.500M16 5.300a3.500 3.500 0 0 1 0 6.400M18.500 14.600c1.700.800 2.700 2.500 3 4.900"/></svg>Чтецы</button>
  </nav>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
var ST={wait:"Ожидается",paid:"Пришёл и заплатил",cancel:"Отменил",noshow:"Не пришёл"};

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return (Math.round(n*100)/100).toLocaleString("ru-RU",{maximumFractionDigits:2})+" ₼"}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function plural(n,a,b,c){var m=n%100,k=n%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>=2&&k<=4)return b;return c}

var today=iso(new Date());
var ui={tab:"day",date:today,filter:"all",period:"day"};
var sheet=null;
var SB_URL="https://ldkhdeehrrajvgrtieal.supabase.co";
var SB_KEY="sb_publishable_HgWeQpSVqGfOdPKOWkwUBg_L67kK0O7";
var sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
var state={readers:[],appts:[]};
var auth={user:null,ready:false,loaded:false,msg:""};

function flash(m){auth.msg=m;render();if(m)setTimeout(function(){if(auth.msg===m){auth.msg="";render()}},6000)}
function refresh(){
  if(!sb||!auth.user)return Promise.resolve();
  return Promise.all([
    sb.from("readers").select("*").order("created_at"),
    sb.from("appts").select("*").order("date",{ascending:false}).limit(5000)
  ]).then(function(res){
    if(res[0].error||res[1].error){flash("Не удалось загрузить записи. Проверьте интернет.");return}
    state.readers=res[0].data.map(function(x){return{id:x.id,name:x.name,price:+x.price,share:+x.share,archived:x.archived}});
    state.appts=res[1].data.map(function(x){return{id:x.id,readerId:x.reader_id,date:x.date,time:x.time,name:x.name,phone:x.phone||"",price:+x.price,share:+x.share,status:x.status,note:x.note||"",settled:x.settled}});
    auth.loaded=true;render();
  },function(){flash("Нет связи с сервером. Проверьте интернет.")});
}
function db(q){
  return q.then(function(r){if(r.error)flash("Не сохранилось: "+r.error.message);return refresh()},
    function(){flash("Нет связи с сервером. Изменение не сохранено.");return refresh()});
}
var rt=null,rtTimer=null;
function startSync(){
  refresh();
  if(rt||!sb)return;
  rt=sb.channel("all").on("postgres_changes",{event:"*",schema:"public"},function(){
    clearTimeout(rtTimer);rtTimer=setTimeout(refresh,300);
  }).subscribe();
}
function stopSync(){if(rt&&sb){sb.removeChannel(rt);rt=null}state={readers:[],appts:[]};auth.loaded=false}

function reader(id){for(var i=0;i<state.readers.length;i++)if(state.readers[i].id===id)return state.readers[i];return null}
function activeReaders(){return state.readers.filter(function(r){return !r.archived})}
function split(a){var m=a.price*a.share/100;return{mgr:m,rd:a.price-m}}

function range(){
  var d=parse(ui.date),s,e;
  if(ui.period==="day"){s=e=ui.date}
  else if(ui.period==="week"){var dow=(d.getDay()+6)%7;s=addDays(ui.date,-dow);e=addDays(s,6)}
  else{s=iso(new Date(d.getFullYear(),d.getMonth(),1));e=iso(new Date(d.getFullYear(),d.getMonth()+1,0))}
  return{s:s,e:e};
}
function pkey(a){var d=(a.phone||"").replace(/\D/g,"");return d.length>=7?"p"+d:"n"+a.name.trim().toLowerCase()}
function patients(){
  var m={};
  state.appts.forEach(function(a){
    var k=pkey(a),p=m[k]||(m[k]={key:k,name:a.name,phone:a.phone,paid:0,noshow:0,cancel:0,wait:0,last:"",lastPaid:"",first:"",next:false,list:[]});
    p[a.status]++;p.list.push(a);
    if(a.status==="paid"){if(a.date>p.lastPaid)p.lastPaid=a.date;if(!p.first||a.date<p.first)p.first=a.date}
    if(a.status==="wait"&&a.date>=today)p.next=true;
    if(a.date>=p.last){p.last=a.date;p.name=a.name;if(a.phone)p.phone=a.phone}
  });
  return m;
}
function waLink(phone,text){
  var d=(phone||"").replace(/\D/g,"");
  if(d.length===10&&d.charAt(0)==="0")d="994"+d.slice(1);
  if(d.length<9)return "";
  return "https://wa.me/"+d+"?text="+encodeURIComponent(text);
}
var prefs={lang:"ru"};
try{var pr=JSON.parse(localStorage.getItem("ruqya.prefs")||"null");if(pr&&pr.lang)prefs.lang=pr.lang}catch(e){}
var AZ_M=["yanvar","fevral","mart","aprel","may","iyun","iyul","avqust","sentyabr","oktyabr","noyabr","dekabr"];
function remindText(a){
  if(prefs.lang==="az"){var d=parse(a.date);return "Salam! Ruqyə üçün yazılışınızı xatırladırıq: "+d.getDate()+" "+AZ_M[d.getMonth()]+", saat "+a.time+". Zəhmət olmasa, gələcəyinizi təsdiqləyin."}
  return "Здравствуйте! Напоминаем о записи на рукъя: "+fmtDay(a.date)+" в "+a.time+". Пожалуйста, подтвердите, что придёте.";
}
function fmtDay(s,opt){return parse(s).toLocaleDateString("ru-RU",opt||{day:"numeric",month:"long"})}

/* ---------- render ---------- */
function render(){
  var tabs=document.querySelectorAll("#tabs button");
  for(var i=0;i<tabs.length;i++){if(tabs[i].dataset.tab===ui.tab)tabs[i].setAttribute("aria-current","page");else tabs[i].removeAttribute("aria-current")}
  var top=document.getElementById("top"),main=document.getElementById("main");
  var gate=!auth.user;
  document.getElementById("tabs").hidden=gate;
  document.getElementById("fab").hidden=gate||ui.tab!=="day"||!activeReaders().length;
  if(gate){
    if(document.getElementById("l-mail")&&auth.ready){var le=document.getElementById("l-err");le.textContent=auth.msg;le.hidden=!auth.msg;return}
    top.innerHTML="<h1>Запись на рукъя</h1>";
    main.innerHTML=!sb?'<div class="empty">Не удалось загрузить приложение. Проверьте интернет и откройте страницу заново.</div>'
      :!auth.ready?'<div class="empty">Загрузка…</div>'
      :'<div class="field"><label for="l-mail">Почта</label><input id="l-mail" type="email" autocomplete="username" inputmode="email"></div>'+

  return seg+'</div>'+navHtml({title:title,small:small});

function cashData(){
  var r=range(),rows={},order=[];
  state.readers.forEach(function(x){rows[x.id]={name:x.name,n:0,sum:0,mgr:0,rd:0,due:0,cancel:0,noshow:0,wait:0};order.push(x.id)});
  state.appts.forEach(function(a){
    if(a.date<r.s||a.date>r.e)return;
    var row=rows[a.readerId];if(!row)return;
    if(a.status==="paid"){var s=split(a);row.n++;row.sum+=a.price;row.mgr+=s.mgr;row.rd+=s.rd;if(!a.settled)row.due+=s.mgr}
    else row[a.status]++;
  });
  var T={n:0,sum:0,mgr:0,rd:0,due:0,cancel:0,noshow:0};
  order.forEach(function(id){var x=rows[id];for(var k in T)T[k]+=x[k]});
  return{r:r,rows:rows,order:order,T:T};
}
function periodTitle(){
  var r=range();
  if(ui.period==="day")return fmtDay(ui.date,{day:"numeric",month:"long",year:"numeric"});
  if(ui.period==="week")return fmtDay(r.s)+" – "+fmtDay(r.e);
  return parse(ui.date).toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
}
function reportText(){
  var d=cashData(),T=d.T,t="Касса: "+periodTitle()+"\nВсего: "+money(T.sum)+" ("+T.n+" "+plural(T.n,"сеанс","сеанса","сеансов")+")\n";
  d.order.forEach(function(id){var x=d.rows[id];if(!x.n)return;
    t+="\n"+x.name+": "+x.n+" "+plural(x.n,"сеанс","сеанса","сеансов")+", "+money(x.sum)+"\n  чтецу "+money(x.rd)+", руководителю "+money(x.mgr)+(x.due>0?" (не сдано "+money(x.due)+")":" (сдано)")+"\n"});
  t+="\nЧтецам: "+money(T.rd)+"\nРуководителю: "+money(T.mgr);
  if(T.due>0)t+="\nЕщё не сдано: "+money(T.due);
  if(T.cancel||T.noshow)t+="\nОтменили: "+T.cancel+", не пришли: "+T.noshow;
  return t;
}
function cashMain(){
  var d=cashData(),rows=d.rows,order=d.order,T=d.T;
  var h='<div class="strip">'+
    '<div class="tile main"><b class="num">'+money(T.sum)+'</b><span>всего в кассе</span></div>'+
    '<div class="tile"><b class="num">'+money(T.rd)+'</b><span>чтецам</span></div>'+
    '<div class="tile"><b class="num">'+money(T.mgr)+'</b><span>руководителю</span></div></div>';
  var shown=0;
  order.forEach(function(id){
    var x=rows[id],rd=reader(id),any=x.n+x.cancel+x.noshow+x.wait;
    if(rd.archived&&!any)return;
    shown++;
    var pct=x.sum?Math.round(x.rd/x.sum*100):0,foot=[];
    if(x.wait)foot.push("ожидается: "+x.wait);
    if(x.cancel)foot.push("отменили: "+x.cancel);
    if(x.noshow)foot.push("не пришли: "+x.noshow);
    h+='<div class="pay"><div class="head"><b>'+esc(x.name)+'</b><span class="num">'+x.n+' '+plural(x.n,"сеанс","сеанса","сеансов")+' · '+money(x.sum)+'</span></div>'+
      '<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
      '<div class="split"><div><span>Чтецу</span><b class="num">'+money(x.rd)+'</b></div><div><span>Руководителю</span><b class="num">'+money(x.mgr)+'</b></div></div>'+
      (foot.length?'<div class="foot">'+cap(foot.join(", "))+'</div>':'')+
      (x.mgr>0?(x.due>0
        ?'<div class="settle due"><span>Не сдано руководителю: <b class="num">'+money(x.due)+'</b></span><button class="ghost" data-act="settle" data-id="'+id+'">Сдал</button></div>'
        :'<div class="settle done"><span>Руководителю сдано полностью</span><button class="link" data-act="unsettle" data-id="'+id+'">Отменить</button></div>'):'')+
      '</div>';
  });
  if(!shown)h+='<div class="empty">Чтецов пока нет. Добавьте их в разделе «Чтецы».</div>';
  else{
    var fin=T.n+T.cancel+T.noshow;
    if(ui.period!=="day"){
      var pm=patients(),nw=0,rp=0,days={};
      state.appts.forEach(function(a){
        if(a.status!=="paid"||a.date<d.r.s||a.date>d.r.e)return;
        days[a.date]=1;if(pm[pkey(a)].first===a.date)nw++;else rp++;
      });
      var nd=Object.keys(days).length;
      h+='<div class="stats"><div class="tile"><b class="num">'+nw+'</b><span>новых пациентов</span></div>'+
        '<div class="tile"><b class="num">'+rp+'</b><span>повторных визитов</span></div>'+
        '<div class="tile"><b class="num">'+nd+'</b><span>рабочих дней</span></div>'+
        '<div class="tile"><b class="num">'+money(nd?T.sum/nd:0)+'</b><span>в среднем за день</span></div></div>';
    }
    h+='<button class="ghost" data-act="report">Отчёт текстом для WhatsApp</button>';
    h+='<button class="ghost" data-act="csv">Скачать таблицу для Excel</button>';
    h+='<p class="hint">'+(fin?'Пришли '+T.n+' из '+fin+' ('+Math.round(T.n/fin*100)+'%). ':'')+'В расчёт идут только сеансы со статусом «Пришёл и заплатил».</p>';
  }
  return h;
}

function downloadCsv(){
  var r=range(),q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
  var rows=[["Дата","Время","Чтец","Пациент","Телефон","Цена","Статус","Чтецу","Руководителю","Сдано руководителю","Заметка"]];
  state.appts.filter(function(a){return a.date>=r.s&&a.date<=r.e})
    .sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)})
    .forEach(function(a){var rd=reader(a.readerId),sp=a.status==="paid"?split(a):{rd:0,mgr:0};
      rows.push([a.date,a.time,rd?rd.name:"",a.name,a.phone,a.price,ST[a.status],sp.rd,sp.mgr,a.status==="paid"?(a.settled?"да":"нет"):"",a.note])});
  var csv="\ufeff"+rows.map(function(x){return x.map(q).join(";")}).join("\r\n");
  try{
    var url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");
    a.href=url;a.download="kassa_"+r.s+"_"+r.e+".csv";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},5000);
  }catch(e){flash("Не получилось скачать файл. Откройте приложение в браузере и попробуйте снова.")}
}
function patientsList(){
  var m=patients(),q=(ui.q||"").trim().toLowerCase(),qd=q.replace(/\D/g,"");
  var sg=ui.seg||"all",old=addDays(today,-30);
  var arr=Object.keys(m).map(function(k){return m[k]}).filter(function(p){
    if(sg==="regular"&&p.paid<3)return false;
    if(sg==="sleep"&&!(p.lastPaid&&p.lastPaid<old&&!p.next))return false;
    if(sg==="noshow"&&!p.noshow)return false;
    if(!q)return true;
    return p.name.toLowerCase().indexOf(q)>=0||(qd&&(p.phone||"").replace(/\D/g,"").indexOf(qd)>=0);
  }).sort(function(a,b){return a.last<b.last?1:a.last>b.last?-1:0});
  if(!arr.length)return '<div class="empty">'+(q?"Никого не нашли. Проверьте имя или номер.":sg==="regular"?"Постоянные пациенты: те, кто был 3 раза и больше. Пока таких нет.":sg==="sleep"?"Здесь появятся те, кто не был больше 30 дней и не записан снова.":sg==="noshow"?"Никто не пропускал запись.":"Пациенты появятся здесь после первой записи.")+'</div>';
  return arr.map(function(p){
    var bits=[p.paid+" "+plural(p.paid,"визит","визита","визитов")];
    if(p.noshow)bits.push("не пришёл: "+p.noshow);
    if(p.cancel)bits.push("отменил: "+p.cancel);
    return '<div class="reader"><button class="open" data-act="patient" data-id="'+esc(p.key)+'"><b>'+esc(p.name)+'</b><span class="num">'+esc(p.phone||"без телефона")+' · '+bits.join(", ")+'</span></button>'+
      '<button class="ghost" data-act="repeat" data-id="'+esc(p.key)+'">Записать</button></div>';
  }).join("");
}

/* ---------- sheets ---------- */
function openSheet(s){
  sheet=s;
  var f={appt:apptForm,reader:readerForm,patient:patientSheet,report:reportSheet}[s.type];
  document.getElementById("sheet").innerHTML=f();document.getElementById("overlay").hidden=false;
  if(s.type==="reader")readerHint();
  if(s.type==="appt")busyHint();
}
function busyHint(){
  var el=document.getElementById("f-busy"),box=document.getElementById("f-slots");if(!el||!box)return;
  var rid=val("f-reader"),date=val("f-date"),cur=val("f-time");
  var t=state.appts.filter(function(x){return x.readerId===rid&&x.date===date&&x.status!=="cancel"&&x.id!==sheet.id}).map(function(x){return x.time}).sort();
  var h="";
  for(var m=9*60;m<=21*60;m+=30){
    var tm=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"),busy=t.indexOf(tm)>=0;
    h+='<button type="button" class="slot" data-act="slot" data-t="'+tm+'"'+(busy?" disabled":"")+' aria-pressed="'+(tm===cur)+'">'+tm+'</button>';
  }
  box.innerHTML=h;
  el.textContent=t.length?"Зачёркнутое время уже занято: "+t.join(", ")+". Другое время можно вписать вручную.":"В этот день у чтеца всё свободно. Время можно выбрать кнопкой или вписать вручную.";
}
function closeSheet(){sheet=null;document.getElementById("overlay").hidden=true}

function apptForm(){
  var a=sheet.id?state.appts.filter(function(x){return x.id===sheet.id})[0]:null;
  var rs=activeReaders(),def=a?a.readerId:(ui.filter!=="all"?ui.filter:rs[0].id);
  if(a&&!rs.some(function(r){return r.id===a.readerId})){var old=reader(a.readerId);if(old)rs=rs.concat([old])}
  var dr=reader(def),pre=sheet.pre||{},pm=patients();
  var names=Object.keys(pm).map(function(k){return '<option value="'+esc(pm[k].name)+'">'}).join("");
  var opts=rs.map(function(r){return '<option value="'+r.id+'"'+(r.id===def?" selected":"")+'>'+esc(r.name)+'</option>'}).join("");
  return '<h2>'+(a?"Изменить запись":"Новая запись")+'<button class="icon-btn" data-act="close" aria-label="Закрыть">×</button></h2>'+
    '<div class="field"><label for="f-reader">Чтец</label><select id="f-reader">'+opts+'</select></div>'+
    '<div class="two"><div class="field"><label for="f-date">Дата</label><input id="f-date" type="date" value="'+(a?a.date:ui.date)+'"></div>'+
    '<div class="field"><label for="f-time">Время</label><input id="f-time" type="time" step="300" value="'+(a?a.time:"")+'"></div></div>'+
    '<div class="slots" id="f-slots"></div><p class="hint" id="f-busy"></p>'+
    '<div class="field"><label for="f-name">Имя пациента</label><input id="f-name" type="text" autocomplete="off" list="f-names" value="'+esc(a?a.name:(pre.name||""))+'"><datalist id="f-names">'+names+'</datalist></div>'+
    '<div class="two"><div class="field"><label for="f-phone">Телефон</label><input id="f-phone" type="tel" autocomplete="off" placeholder="+994" value="'+esc(a?a.phone:(pre.phone||""))+'"></div>'+
    '<div class="field"><label for="f-price">Цена, ₼</label><input id="f-price" type="number" inputmode="decimal" min="0" value="'+(a?a.price:(dr?dr.price:""))+'"></div></div>'+
    '<div class="field"><label for="f-note">Заметка (необязательно)</label><input id="f-note" type="text" autocomplete="off" value="'+esc(a?a.note||"":"")+'"></div>'+
    '<p class="err" id="f-err" hidden></p>'+
    '<div class="btns"><button class="primary" data-act="save-appt">'+(a?"Сохранить":"Записать")+'</button>'+
    (a?'<button class="danger" data-act="del-appt">Удалить</button>':'')+'</div>';
}

function readerForm(){
  var r=sheet.id?reader(sheet.id):null;
  return '<h2>'+(r?"Изменить чтеца":"Новый чтец")+'<button class="icon-btn" data-act="close" aria-label="Закрыть">×</button></h2>'+
    '<div class="field"><label for="r-name">Имя</label><input id="r-name" type="text" autocomplete="off" value="'+esc(r?r.name:"")+'"></div>'+
    '<div class="two"><div class="field"><label for="r-price">Цена сеанса, ₼</label><input id="r-price" type="number" inputmode="decimal" min="0" value="'+(r?r.price:150)+'"></div>'+
    '<div class="field"><label for="r-share">Доля руководителя, %</label><input id="r-share" type="number" inputmode="decimal" min="0" max="100" value="'+(r?r.share:50)+'"></div></div>'+
    '<p class="hint" id="r-hint"></p><p class="err" id="r-err" hidden></p>'+
    '<div class="btns"><button class="primary" data-act="save-reader">Сохранить</button>'+
    (r?'<button class="danger" data-act="del-reader">Убрать</button>':'')+'</div>';
}
function readerHint(){
  var p=parseFloat(val("r-price")),s=parseFloat(val("r-share")),el=document.getElementById("r-hint");
  if(!el)return;
  if(isNaN(p)||isNaN(s)||s<0||s>100){el.textContent="";return}
  var m=p*s/100;el.textContent="С одного сеанса: чтецу "+money(p-m)+", руководителю "+money(m)+".";
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():""}
function fail(id,msg){var e=document.getElementById(id);e.textContent=msg;e.hidden=false}

function saveAppt(){
  var rid=val("f-reader"),date=val("f-date"),time=val("f-time"),name=val("f-name"),phone=val("f-phone"),price=parseFloat(val("f-price"));
  var r=reader(rid);
  if(!r)return fail("f-err","Выберите чтеца.");
  if(!date||!time)return fail("f-err","Укажите дату и время.");
  if(!name)return fail("f-err","Впишите имя пациента.");
  if(isNaN(price)||price<0)return fail("f-err","Укажите цену сеанса.");
  var clash=state.appts.filter(function(x){return x.readerId===rid&&x.date===date&&x.time===time&&x.id!==sheet.id&&x.status!=="cancel"})[0];
  if(clash)return fail("f-err","У чтеца "+r.name+" на "+time+" уже записан пациент: "+clash.name+". Выберите другое время.");
  if(sheet.id){
    var a=state.appts.filter(function(x){return x.id===sheet.id})[0];
    if(a.readerId!==rid)a.share=r.share;
    a.readerId=rid;a.date=date;a.time=time;a.name=name;a.phone=phone;a.price=price;a.note=val("f-note");
    db(sb.from("appts").update({reader_id:rid,date:date,time:time,name:name,phone:phone,price:price,share:a.share,note:a.note}).eq("id",a.id));
  }else{
    var row={reader_id:rid,date:date,time:time,name:name,phone:phone,price:price,share:r.share,status:"wait",note:val("f-note")};
    state.appts.push({id:"tmp"+uid(),readerId:rid,date:date,time:time,name:name,phone:phone,price:price,share:r.share,status:"wait",note:row.note,settled:false});
    db(sb.from("appts").insert(row));
  }
  ui.date=date;ui.tab="day";if(ui.filter!=="all"&&ui.filter!==rid)ui.filter="all";
  closeSheet();render();
}

function saveReader(){
  var name=val("r-name"),price=parseFloat(val("r-price")),share=parseFloat(val("r-share"));
  if(!name)return fail("r-err","Впишите имя чтеца.");
  if(isNaN(price)||price<0)return fail("r-err","Укажите цену сеанса.");
  if(isNaN(share)||share<0||share>100)return fail("r-err","Доля руководителя должна быть от 0 до 100%.");
  if(sheet.id){var r=reader(sheet.id);r.name=name;r.price=price;r.share=share;
    db(sb.from("readers").update({name:name,price:price,share:share}).eq("id",sheet.id))}
  else db(sb.from("readers").insert({name:name,price:price,share:share}));
  closeSheet();render();
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  if(e.target.id==="overlay"){closeSheet();return}
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;
  if(act==="tab"){ui.tab=b.dataset.tab}
  else if(act==="goto"){ui.date=b.dataset.d}
  else if(act==="seg"){ui.seg=id;document.getElementById("top").innerHTML=""}
  else if(act==="lang"){prefs.lang=id;try{localStorage.setItem("ruqya.prefs",JSON.stringify(prefs))}catch(err){}}
  else if(act==="slot"){document.getElementById("f-time").value=b.dataset.t;busyHint();return}
  else if(act==="csv"){downloadCsv();return}
  else if(act==="shift"){
    var n=+b.dataset.n;
    if(ui.tab==="cash"&&ui.period==="week")ui.date=addDays(ui.date,7*n);
    else if(ui.tab==="cash"&&ui.period==="month"){var d=parse(ui.date);ui.date=iso(new Date(d.getFullYear(),d.getMonth()+n,1))}
    else ui.date=addDays(ui.date,n);
  }
  else if(act==="today"){ui.date=today}
  else if(act==="filter"){ui.filter=id}
  else if(act==="period"){ui.period=b.dataset.p}
  else if(act==="status"){var a=state.appts.filter(function(x){return x.id===id})[0];if(a){a.status=b.dataset.st;if(a.status!=="paid")a.settled=false;
      if(String(a.id).indexOf("tmp")!==0)db(sb.from("appts").update({status:a.status,settled:!!a.settled}).eq("id",a.id))}}
  else if(act==="settle"||act==="unsettle"){
    var rg=range();
    state.appts.forEach(function(x){if(x.readerId===id&&x.status==="paid"&&x.date>=rg.s&&x.date<=rg.e)x.settled=act==="settle"});
    db(sb.from("appts").update({settled:act==="settle"}).eq("reader_id",id).eq("status","paid").gte("date",rg.s).lte("date",rg.e));
  }
  else if(act==="report"){openSheet({type:"report"});return}
  else if(act==="patient"){openSheet({type:"patient",id:id});return}
  else if(act==="repeat"){
    var pp=patients()[id];
    if(!activeReaders().length){closeSheet();ui.tab="readers";render();return}
    openSheet({type:"appt",id:null,pre:pp?{name:pp.name,phone:pp.phone}:{}});return;
  }
  else if(act==="copy"){
    var ta=document.getElementById("rep"),msg=document.getElementById("rep-msg");
    var no=function(){ta.focus();ta.select();msg.textContent="Не получилось скопировать само. Текст выделен: скопируйте его вручную."};
    try{navigator.clipboard.writeText(ta.value).then(function(){msg.textContent="Скопировано. Вставьте в WhatsApp."},no)}catch(err){no()}
    return;
  }
  else if(act==="new-appt"){openSheet({type:"appt",id:null});return}
  else if(act==="edit-appt"){openSheet({type:"appt",id:id});return}
  else if(act==="new-reader"){openSheet({type:"reader",id:null});return}
  else if(act==="edit-reader"){openSheet({type:"reader",id:id});return}
  else if(act==="close"){closeSheet();return}
  else if(act==="save-appt"){saveAppt();return}
  else if(act==="save-reader"){saveReader();return}
  else if(act==="del-appt"||act==="del-reader"){
    if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Нажмите ещё раз";return}
    var sid=sheet.id;
    if(act==="del-appt"){state.appts=state.appts.filter(function(x){return x.id!==sid});db(sb.from("appts").delete().eq("id",sid))}
    else{
      var used=state.appts.some(function(x){return x.readerId===sid});
      if(used){reader(sid).archived=true;db(sb.from("readers").update({archived:true}).eq("id",sid))}
      else{state.readers=state.readers.filter(function(x){return x.id!==sid});db(sb.from("readers").delete().eq("id",sid))}
      if(ui.filter===sid)ui.filter="all";
    }
    closeSheet();
  }
  else if(act==="login"){
    var mail=val("l-mail"),pass=document.getElementById("l-pass").value;
    if(!mail||!pass){auth.msg="Впишите почту и пароль.";render();return}
    b.disabled=true;auth.msg="";
    sb.auth.signInWithPassword({email:mail,password:pass}).then(function(r){
      b.disabled=false;
      if(r.error){auth.msg="Неверная почта или пароль.";render()}
    },function(){b.disabled=false;auth.msg="Нет связи с сервером. Проверьте интернет.";render()});
    return;
  }
  else if(act==="logout"){sb.auth.signOut();return}
  render();
});
document.addEventListener("input",function(e){
  if(e.target.id==="r-price"||e.target.id==="r-share")readerHint();
  if(e.target.id==="q"){ui.q=e.target.value;document.getElementById("plist").innerHTML=patientsList()}
});
document.addEventListener("change",function(e){
  if(e.target.id==="f-reader"||e.target.id==="f-date"||e.target.id==="f-time")busyHint();
  if(e.target.id==="f-name"){
    var ph=document.getElementById("f-phone"),nm=e.target.value.trim().toLowerCase(),pm=patients();
    if(ph&&!ph.value)Object.keys(pm).some(function(k){if(pm[k].name.toLowerCase()===nm&&pm[k].phone){ph.value=pm[k].phone;return true}return false});
  }
  if(e.target.id==="f-reader"&&sheet&&!sheet.id){var r=reader(e.target.value);if(r)document.getElementById("f-price").value=r.price}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&(e.target.id==="l-mail"||e.target.id==="l-pass")){var lb=document.querySelector('[data-act="login"]');if(lb)lb.click()}
});
window.addEventListener("offline",function(){auth.msg="Нет интернета. Изменения сейчас не сохранятся.";render()});
window.addEventListener("online",function(){auth.msg="";refresh();render()});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&auth.user){today=iso(new Date());refresh()}});
if(sb){
  sb.auth.onAuthStateChange(function(ev,sess){
    var was=auth.user&&auth.user.id,now=sess&&sess.user&&sess.user.id;
    auth.user=sess?sess.user:null;auth.ready=true;auth.msg="";
    if(now&&now!==was)setTimeout(startSync,0);
    if(!now&&was)stopSync();
    if(!now){document.getElementById("main").innerHTML=""}
    render();
  });
}else{auth.ready=true}
render();
})();
</script>
</body>
</html>
