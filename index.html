<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e6b5b">
<script>
/* Interface language, chosen in Ayarlar (or on the sign-in screen) and kept on this phone: "az" (default) or "ru". */
var LANG="az";try{if(localStorage.getItem("ruqya.lang")==="ru")LANG="ru"}catch(e){}
if(LANG==="ru")document.documentElement.setAttribute("lang","ru");
/* Light / dark / automatic, chosen in Ayarlar and kept on this phone. */
function applyTheme(t){
  var r=document.documentElement;
  if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");
  var dark=t==="dark"||(t!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",dark?"#0f1514":"#0e6b5b");
}
try{applyTheme(localStorage.getItem("ruqya.theme")||"auto")}catch(e){}
try{var mq=window.matchMedia("(prefers-color-scheme: dark)"),onMq=function(){var t="auto";try{t=localStorage.getItem("ruqya.theme")||"auto"}catch(e){}if(t==="auto")applyTheme("auto")};
  if(mq.addEventListener)mq.addEventListener("change",onMq);else if(mq.addListener)mq.addListener(onMq)}catch(e){}
</script>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="favicon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruqyatz">
<title>Ruqyatz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load without holding up the page: if Google is slow or blocked, the app opens at once with the phone's own font. -->
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Onest:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Onest:wght@600;700&display=swap" rel="stylesheet"></noscript>
<style>
/* Layout idea: one-screen phone app. Fixed header and bottom tabs, a scrolling
   list between them, forms slide up as a bottom sheet. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#16211e; --muted:#5f6e69; --line:#dbe2df; --line-soft:#ebf0ee; --hatch:#e3e9e6;
  --accent:#0e6b5b; --accent-ink:#ffffff; --accent-soft:#dff0ec;
  --ok:#1b7a48; --ok-soft:#def2e6; --warn:#a86200; --warn-soft:#fbecd2; --bad:#b0352d; --bad-soft:#f9e1de;
  --font-display:"Onest","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#18201e; --ink:#e6eeeb; --muted:#93a39e; --line:#2a3633; --line-soft:#1f2927; --hatch:#24302d;
    --accent:#4bbfa8; --accent-ink:#06211c; --accent-soft:#17332e;
    --ok:#5fcf8f; --ok-soft:#173224; --warn:#e7ad52; --warn-soft:#3a2c12; --bad:#f08b82; --bad-soft:#3d1e1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18201e; --ink:#e6eeeb; --muted:#93a39e; --line:#2a3633; --line-soft:#1f2927; --hatch:#24302d;
  --accent:#4bbfa8; --accent-ink:#06211c; --accent-soft:#17332e;
  --ok:#5fcf8f; --ok-soft:#173224; --warn:#e7ad52; --warn-soft:#3a2c12; --bad:#f08b82; --bad-soft:#3d1e1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.top{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.top h1{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0;text-wrap:balance}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}

.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.daynav{display:flex;align-items:center;gap:8px}
.daynav .label{flex:1;font-family:var(--font-display);font-weight:600;font-size:17px;min-width:0}
.daynav button.label{background:none;border:0;padding:4px 6px;margin:-4px -6px;text-align:left;border-radius:10px;cursor:pointer;line-height:1.25}
.daynav button.label:active{background:var(--line-soft)}
.daynav .label .cv{display:inline-block;font-size:12px;color:var(--accent);margin-left:5px;vertical-align:2px}
.mhead{display:flex;align-items:center;gap:8px}.mhead b{flex:1;text-align:center;font-family:var(--font-display);font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-gap:4px;gap:4px}
.mgrid .h{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0}
.mgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.mgrid button b{font-size:16px;font-weight:600}.mgrid button i{font-style:normal;font-size:11px;min-height:14px;color:var(--accent);font-weight:600}
.mgrid button.out{opacity:.38}
.mgrid button.today b{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.mgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.mgrid button[aria-pressed="true"] b,.mgrid button[aria-pressed="true"] i{color:var(--accent-ink)}
.daynav .label small{display:block;font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;flex:none}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:500}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.tile b{display:block;font-family:var(--font-display);font-size:19px;font-weight:700;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.main span{color:inherit;opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--line)}
.card.paid{border-left-color:var(--ok)}
.card.cancel{border-left-color:var(--bad)}
.card.noshow{border-left-color:var(--warn)}
.card.wait{border-left-color:var(--accent)}
.card .row{display:flex;gap:12px;align-items:flex-start}
.card .time{font-family:var(--font-display);font-weight:700;font-size:18px;flex:none;width:52px}
.card .who{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}.card .who span{display:block}
.card .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.card .who span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.card .price{font-weight:600;flex:none;text-align:right}
.card.cancel .price,.card.noshow .price{color:var(--muted);text-decoration:line-through}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{border-radius:11px;padding:10px 12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.actions .go{flex:1 1 100%;background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme="dark"] .actions .go{color:#06210f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .actions .go{color:#06210f}}
.actions .half{flex:1}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.cancel{background:var(--bad-soft);color:var(--bad)}
.pill.noshow{background:var(--warn-soft);color:var(--warn)}
.link{background:none;border:0;padding:6px 4px;font-size:14px;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.spacer{flex:1}

.fab{flex:none;margin:8px 16px 10px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;font-weight:600;font-size:16px}
.shell{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r)}
.note{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.note p{margin:0;flex:1}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.pay{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.pay .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pay .head b{font-family:var(--font-display);font-size:17px;overflow-wrap:anywhere}
.pay .head span{font-size:13px;color:var(--muted);flex:none}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div span{display:block;font-size:12px;color:var(--muted)}
.split div b{font-size:18px;font-weight:600}
.split div:last-child{text-align:right}
.pay .foot{font-size:13px;color:var(--muted)}
.stt{width:100%;border-collapse:collapse;font-size:15px}
.stt th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:4px 6px 6px;border-bottom:1px solid var(--line)}
.stt td{padding:9px 6px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.stt .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.stt tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.copyb{flex:none;padding:8px 12px;font-size:14px}

.sthead{display:flex;flex-direction:column;gap:8px;margin-top:14px}.sthead h3.sec{margin:0}
.explain{font-size:14px;gap:6px}.explain p{margin:0}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}.terms{margin:0}.terms dt{font-weight:700;margin-top:8px}.terms dt:first-child{margin-top:0}.terms dd{margin:2px 0 0}.nogap .rules>*+*{margin-top:8px}

.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center}
.reader div{flex:1;min-width:0}
.reader b{display:block;font-weight:600;overflow-wrap:anywhere}
.reader span{font-size:13px;color:var(--muted)}
.primary{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:13px 16px;font-weight:600;font-size:16px}
.danger{border:1px solid var(--bad);color:var(--bad);background:none;border-radius:12px;padding:13px 16px;font-weight:600}

.overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h2{font-family:var(--font-display);font-size:19px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.err{color:var(--bad);font-size:14px;font-weight:500;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .primary{flex:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;min-width:0}
.wd span{font-size:11px;color:var(--muted)}
.wd b{font-size:15px;font-weight:600}
.wd i{font-style:normal;font-size:11px;min-height:15px;color:var(--accent);font-weight:600}
.wd.today b{text-decoration:underline;text-underline-offset:3px}
.wd[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.wd[aria-pressed="true"] span,.wd[aria-pressed="true"] b,.wd[aria-pressed="true"] i{color:var(--accent-ink)}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.slot{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 0;font-size:13px;font-variant-numeric:tabular-nums}
.slot:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
a.link{display:inline-block}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.more summary{padding:12px 14px;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer}
.morebody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.sheet details.more{background:var(--bg)}
h3.sec{font-family:var(--font-display);font-size:15px;margin:8px 0 0;color:var(--muted);font-weight:600}
.visit b{flex:none}
main.gridmode{padding:0;gap:0;overflow:hidden}
main.gridmode>.note,main.gridmode>.empty,main.gridmode>.sumline{margin:4px 16px 8px}
.sumline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sumline b{color:var(--ink)}
.toolrow{display:flex;gap:8px;align-items:center;min-width:0}
.toolrow .chips{flex:1;min-width:0}
.viewsw{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;flex:none}
.viewsw button{border:0;background:none;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);font-weight:500}
.viewsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);background:var(--surface);overscroll-behavior:contain}
.cal-in{position:relative;min-width:100%}
.cal-head{position:sticky;top:0;z-index:4;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.cal-head .corner{position:sticky;left:0;z-index:5;width:40px;flex:none;background:var(--surface)}
.cal-head .ch{flex:1 0 68px;width:68px;padding:6px 3px;font-size:12px;font-weight:600;text-align:center;border-left:1px solid var(--line);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.cal-head .ch{cursor:pointer}
.cal-head .ch i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.cal-body{display:flex;position:relative}
.axis{position:sticky;left:0;z-index:3;width:40px;flex:none;background:var(--surface)}
.axis span{position:absolute;right:5px;font-size:10.5px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.col{flex:1 0 68px;width:68px;position:relative;border-left:1px solid var(--line);cursor:pointer;
  background-image:linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 100%),
  linear-gradient(to bottom,var(--line-soft) 0,var(--line-soft) 1px,transparent 1px,transparent 100%);background-repeat:repeat-y}
/* Two fingers on the calendar stretch or shrink the hours, as in Google Calendar; the browser's own page zoom stays off there. */
.cal{touch-action:pan-x pan-y}
.cal-body.pinch{will-change:transform}
.ev{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 4px;overflow:hidden;font-size:11px;line-height:1.2;color:#fff;cursor:pointer;border:0;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:1px}
.ev b{font-weight:600;font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.ev span{overflow:hidden;opacity:.92;white-space:nowrap;font-size:10px;letter-spacing:-.2px}
.ev span.ph{white-space:normal;overflow-wrap:anywhere}
.ev>*{flex-shrink:0}
.ev.tight b{-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;display:block}.ev.tight span,.ev.tight span.by{white-space:nowrap;text-overflow:ellipsis}
.ev span.by{white-space:normal;letter-spacing:0;font-weight:600;opacity:1;line-height:1.15;margin-top:1px}
.ev.noshow{opacity:.6;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0,rgba(255,255,255,.22) 5px,transparent 5px,transparent 10px)}
.ev.cancel{background:var(--line)!important;color:var(--muted);text-decoration:line-through;box-shadow:none}
.brk{position:absolute;left:0;right:0;z-index:1;pointer-events:none;font-size:11px;color:var(--muted);padding:2px 6px;
  background:repeating-linear-gradient(135deg,var(--hatch) 0,var(--hatch) 6px,transparent 6px,transparent 12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nowline{position:absolute;left:0;right:0;height:2px;background:#d93025;z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#d93025}
.detail .row2{display:flex;gap:10px;align-items:center;font-size:14px}
.detail .row2 span{color:var(--muted)}
.stbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stbtns button{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 8px;font-size:14px;font-weight:600}
.stbtns button[aria-pressed="true"].paid{background:var(--ok);border-color:var(--ok);color:#fff}
.stbtns button[aria-pressed="true"].cancel{background:var(--bad);border-color:var(--bad);color:#fff}
.stbtns button[aria-pressed="true"].noshow{background:var(--warn);border-color:var(--warn);color:#fff}
.stbtns button[aria-pressed="true"].wait{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;border-radius:12px;border:1px solid var(--line)}
.sheet.wide{max-width:none;height:94%;max-height:94%;padding:14px 0 0;gap:10px;overflow:hidden}
.sheet.wide>h2,.sheet.wide>.seg,.sheet.wide>.hint{margin:0 14px}
.sheet.wide .seg{grid-template-columns:repeat(var(--n),1fr)}
.xl{flex:1;min-height:0;overflow:auto;border-top:1px solid #c8c8c8;background:#fff;-webkit-overflow-scrolling:touch}
.xl table{border-collapse:separate;border-spacing:0;font:12.5px/1.3 Calibri,"Segoe UI",Arial,sans-serif;color:#111;font-variant-numeric:tabular-nums}
.xl td,.xl th{border-right:1px solid #d4d4d4;border-bottom:1px solid #d4d4d4;padding:4px 7px;white-space:nowrap;background:#fff;min-width:44px}
.xl th{background:#f2f2f2;color:#555;font-weight:500;text-align:center;position:sticky;top:0;z-index:2;font-size:11px}
.xl th.rn,.xl td.rn{position:sticky;left:0;z-index:1;background:#f2f2f2;color:#555;text-align:center;min-width:30px;font-size:11px}
.xl th.rn{z-index:3}
.xl td.n{text-align:right}
.xl tr.hd td:not(.rn){background:#e2efda;font-weight:700}
.xl tr.tt td:not(.rn){font-weight:700;font-size:14px}
.xl td.mg{text-align:center;font-weight:700;background:#fff2cc}
.log{font-size:13.5px;padding:8px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.log small{display:block;color:var(--muted);font-size:12px}.log.del{color:var(--bad)}
.tag.by{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500}
.tabs button{min-width:0}
@media (max-width:360px){.tabs button{font-size:10.5px;padding:8px 1px 10px}.tabs svg{width:20px;height:20px}}
.nogap main>*+*,.nogap .top>*+*,.nogap .sheet>*+*,.nogap .card>*+*,.nogap .pay>*+*,.nogap .morebody>*+*,.nogap #plist>*+*,.nogap .field>*+*,.nogap .detail>*+*{margin-top:10px}
.nogap .btns>*+*,.nogap .actions>*,.nogap .daynav>*+*,.nogap .toolrow>*+*,.nogap .chips>*+*,.nogap .links>*+*,.nogap .tags>*+*,.nogap .row>*+*,.nogap .status>*+*,.nogap .reader>*+*,.nogap .visit>*+*,.nogap .brand>*+*,.nogap .settle>*+*{margin-left:8px}
.nogap .actions>*{margin:0 8px 8px 0}
.note.warnbox{background:var(--warn-soft);color:var(--warn);font-weight:500}
.strip,.stats,.stbtns{grid-gap:8px}.split,.two{grid-gap:10px}.seg{grid-gap:3px}.week{grid-gap:4px}.slots{grid-gap:5px}.viewsw{grid-gap:2px}
[hidden]{display:none!important}
.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;min-height:150px;font:inherit;color:inherit;resize:vertical}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);grid-gap:10px;gap:10px;margin:6px 0 4px}
.swatches button{aspect-ratio:1;min-height:38px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;margin-right:8px}
button.visit.vbtn{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;font:inherit;color:inherit;padding-left:0;padding-right:0}
.agent{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;font-size:14px;text-align:left}
.agent span:first-child{flex:1;min-width:0}.agent .chev{color:var(--muted);font-size:18px;flex:none}
.agrow{display:flex;gap:10px;align-items:baseline;font-size:14px;padding:9px 0;border-top:1px solid var(--line)}
.agrow>span:first-child{flex:1;min-width:0}.agrow small{display:block;color:var(--muted);font-size:12.5px}
.agsum{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:14px;margin:6px 0 0}
.agsum b{text-align:right}.agsum .h{color:var(--muted);font-size:12px;font-weight:600}
.memo{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere}
a.wa{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;padding:10px 12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--accent);text-decoration:none;flex:1}
.settle{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.settle span{flex:1}
.settle.due b{color:var(--warn)}
.settle.done{color:var(--ok);font-weight:500}
.search{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;width:100%;min-height:46px}
#plist{display:flex;flex-direction:column;gap:12px}
.reader button.open{all:unset;cursor:pointer;flex:1;min-width:0;display:block}
.visit{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.pvisits{display:flex;flex-direction:column;gap:10px;margin:4px 0 12px}
.pvisit{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.pv-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.pv-top b{font-size:15px}
.pv-row{display:flex;flex-wrap:wrap;gap:4px 14px}.pv-row.muted{color:var(--muted);font-size:13px}
.pv-btns{display:flex;gap:8px;margin-top:2px}.pv-btns>*{flex:1;padding:8px 10px}.danger-t{color:var(--bad)}
.nogap .pvisits>*+*,.nogap .pvisit>*+*{margin-top:8px}.nogap .pv-btns>*+*{margin-left:8px}
.visit span:first-child{flex:1;min-width:0}

"Qaydalar":"Правила",
"<li><b>Həftə</b> cümə günü başlayır, cümə axşamı bitir (7 gün).</li>":"<li><b>Неделя</b> начинается в пятницу и заканчивается в четверг (7 дней).</li>",
"<li><b>Həftəlik statistika</b> həmişə son <b>bitmiş</b> həftəni göstərir. Yeni həftə cümə axşamı gecə 23:59-dan sonra görünür. Beləcə cümə səhər açıb kopyalayıb rəhbərliyə göndərə bilərsiniz.</li>":"<li><b>Недельная статистика</b> всегда показывает последнюю <b>закончившуюся</b> неделю. Новая неделя появляется после четверга, 23:59. Так в пятницу утром можно открыть, скопировать и отправить руководству.</li>",
"<li><b>Aylıq statistika</b> ayın ilk cüməsindən başlayır və növbəti ayın ilk cüməsindən bir gün əvvəl (cümə axşamı gecə 23:59-da) bitir. Ayda 4 cümə varsa 4 həftə, 5 cümə varsa 5 həftə olur — heç bir gün itmir. Ekranda son bitmiş ay görünür.</li>":"<li><b>Месячная статистика</b> начинается с первой пятницы месяца и заканчивается за день до первой пятницы следующего месяца (в четверг в 23:59). Если в месяце 4 пятницы — 4 недели, если 5 — 5 недель, ни один день не теряется. На экране — последний закончившийся месяц.</li>",
"<li>Bu günün məlumatı həftəlik və aylıq cədvələ gecə 23:59-dan sonra düşür. «Bu gün yazılan qəbullar» isə hər yeni qəbulda dərhal yenilənir və gecə 00:00-da sıfırlanır.</li>":"<li>Данные сегодняшнего дня попадают в недельную и месячную таблицы после 23:59. «Записи за сегодня» обновляются сразу при каждой новой записи и обнуляются в 00:00.</li>",
"<li>Pasiyent gəlməyibsə, onu təqvimdən silirlər. Seansın vaxtı bitəndə (ən gec gecə 23:59-da) silinməyən hər qəbul uğurlu sayılır. Keçmiş günə yazılan qəbul dərhal uğurlu sayılır.</li>":"<li>Если пациент не пришёл, его удаляют из календаря. Когда время сеанса прошло (не позже 23:59), каждая неудалённая запись считается успешной. Запись на прошедший день сразу считается успешной.</li>",
"<li>Silinən qəbul heç yerdə sayılmır. Həftələr sonra silinsə də, statistikadan çıxır.</li>":"<li>Удалённая запись нигде не считается. Даже если удалили через несколько недель, она уходит из статистики.</li>",
"<li>Qəbul yazıldığı günə görə sayılır, hansı günə yazılmasından asılı olmayaraq: 11 noyabrda 22 noyabra yazılıbsa, 11 noyabrın həftəsinə düşür.</li>":"<li>Запись считается по дню, когда её сделали, на какую бы дату она ни была: если 11 ноября записали на 22 ноября, это идёт в неделю 11 ноября.</li>",
"<li>Satış statistikasına yalnız satış agentlərinin və adminlərin yazdığı qəbullar düşür. Mütəxəssislərin özlərinin yazdığı qəbullar oraya düşmür, amma Pul statistikasında sayılır.</li>":"<li>В статистику продаж попадают только записи агентов продаж и админов. Записи, сделанные самими специалистами, туда не попадают, но считаются в денежной статистике.</li>",
"<li>Hər qəbulda qiymət yazmaq vacibdir (yeni qəbulda 130 hazır durur). Məhsulu kim Kassada yazıbsa, satan o sayılır.</li>":"<li>Цена обязательна в каждой записи (в новой записи уже стоит 130). Продавцом товара считается тот, кто записал продажу в Кассе.</li>",

"Aylıq statistika":"Месячная статистика",
"<p><b>Aylıq statistika</b> — ayın ilk cüməsindən başlayır və növbəti ayın ilk cüməsindən bir gün əvvəl (cümə axşamı gecə 23:59-da) bitir. Ayda 4 cümə varsa 4 həftə, 5 cümə varsa 5 həftə olur — beləcə heç bir gün itmir. Ay bitəndən sonra ekranda yeni ay görünür.</p>":"<p><b>Месячная статистика</b> начинается с первой пятницы месяца и заканчивается за день до первой пятницы следующего месяца (в четверг в 23:59). Если в месяце 4 пятницы — это 4 недели, если 5 — 5 недель, так что ни один день не теряется. Когда месяц закончился, на экране появляется новый.</p>",
"Məsələn: {m1} — {r1}, {m2} — {r2}, {m3} — {r3}.":"Например: {m1} — {r1}, {m2} — {r2}, {m3} — {r3}.",
"İndi ekranda {m1} görünür; o, {b} gecə 23:59-a qədər qalır, sonra {m2} görünəcək.":"Сейчас на экране {m1}; он остаётся до 23:59 ({b}), потом появится {m2}.",
"Həftəlik statistika (7 gün)":"Недельная статистика (7 дней)",
"cümə – cümə axşamı, həftə bitib":"пятница – четверг, неделя закончилась",
"4 həftə (28 gün), cümə – cümə axşamı":"4 недели (28 дней), пятница – четверг",
"4 həftə hələ bitməyib":"4 недели ещё не закончились",
"Qaydalar və terminlər":"Правила и термины",
"<p><b>Həftə</b> — 7 gün: cümə, şənbə, bazar, bazar ertəsi, çərşənbə axşamı, çərşənbə, cümə axşamı.</p>":"<p><b>Неделя</b> — 7 дней: пятница, суббота, воскресенье, понедельник, вторник, среда, четверг.</p>",
"<p><b>Həftəlik statistika</b> həmişə son <b>bitmiş</b> həftəni göstərir. Həftə cümə axşamı gecə 23:59-da bitir, yeni həftə o andan sonra görünür. Beləcə cümə səhər açıb kopyalayıb rəhbərliyə göndərə bilərsiniz.</p>":"<p><b>Недельная статистика</b> всегда показывает последнюю <b>закончившуюся</b> неделю. Неделя заканчивается в четверг в 23:59, новая неделя появляется только после этого. Так в пятницу утром можно открыть, скопировать и отправить руководству.</p>",
"İndi ekranda {a} həftəsi görünür. O, {b} gecə 23:59-a qədər qalır, sonra {c} həftəsi görünəcək.":"Сейчас на экране неделя {a}. Она остаётся до 23:59 ({b}), потом появится неделя {c}.",
"İlk həftə ({a}) hələ bitməyib — indiyə qədər bitmiş günlər göstərilir. Həftə {b} gecə 23:59-da bitəndən sonra tam olacaq və {c} gecə 23:59-a qədər ekranda qalacaq.":"Первая неделя ({a}) ещё не закончилась — показаны уже прошедшие дни. Неделя станет полной после 23:59 ({b}) и останется на экране до 23:59 ({c}).",
"<p><b>Aylıq statistika</b> — 4 həftə (28 gün), o da cümə başlayır, cümə axşamı bitir və eyni qayda ilə dəyişir.</p>":"<p><b>Месячная статистика</b> — 4 недели (28 дней), тоже с пятницы по четверг, и меняется по тому же правилу.</p>",
"İndi ekranda {a} görünür. O, {b} gecə 23:59-a qədər qalır, sonra {c} görünəcək.":"Сейчас на экране {a}. Это остаётся до 23:59 ({b}), потом появится {c}.",
"İndiki 4 həftə ({a}) hələ bitməyib — indiyə qədər bitmiş günlər göstərilir. Bu 4 həftə {b} gecə 23:59-da bitəndən sonra tam olacaq və {c} gecə 23:59-a qədər ekranda qalacaq.":"Текущие 4 недели ({a}) ещё не закончились — показаны уже прошедшие дни. Они станут полными после 23:59 ({b}) и останутся на экране до 23:59 ({c}).",
"<p><b>Bu gün yazılan qəbullar</b> — bu gün kim neçə qəbul yazıb (qəbul hansı günə olsa da). Hər yeni qəbulda dərhal yenilənir, gecə 00:00-da sıfırlanır.</p>":"<p><b>Записи за сегодня</b> — кто сколько записей сделал сегодня (на любую дату). Обновляется сразу при каждой новой записи, в 00:00 обнуляется.</p>",
"<p><b>Uğurlu</b> — həmin günlərdə seansı olan və təqvimdən silinməyən pasiyentlər. Pasiyent gəlməyibsə, onu təqvimdən silirlər. Seansın vaxtı bitəndə (ən gec gecə 23:59-da) silinməyən hər qəbul uğurlu sayılır. Keçmiş günə yazılan qəbul dərhal uğurlu sayılır.</p>":"<p><b>Успешно</b> — пациенты, у которых был сеанс в эти дни и которых не удалили из календаря. Если пациент не пришёл, его удаляют. Когда время сеанса прошло (не позже 23:59), каждая неудалённая запись считается успешной. Запись на прошедший день сразу считается успешной.</p>",
"<p><b>Qazanc</b> — uğurlu seansların qiymətlərinin cəmi. Hər qəbulda qiymət yazmaq vacibdir (yeni qəbulda 130 hazır durur).</p>":"<p><b>Доход</b> — сумма цен успешных сеансов. Цена обязательна в каждой записи (в новой записи уже стоит 130).</p>",
"<p><b>Məhsul</b> — Kassada yazılan məhsul satışları: kim satıb, neçə dəfə (Satış) və neçə manatlıq (Məbləğ). Satan avtomatik olaraq satışı yazan işçidir.</p>":"<p><b>Товары</b> — продажи товаров, записанные в Кассе: кто продал, сколько раз (Продаж) и на сколько манат (Сумма). Продавец — сотрудник, который записал продажу.</p>",
"<p><b>Cəmi</b> — cədvəldəki bütün sətirlərin toplamı.</p>":"<p><b>Итого</b> — сумма всех строк таблицы.</p>",
"<p><b>Silinən qəbul</b> heç yerdə sayılmır — nə «Yazdı»da, nə «Uğurlu»da, nə «Qazanc»da. Həftələr sonra silinsə də, statistikadan çıxır.</p>":"<p><b>Удалённая запись</b> нигде не считается — ни в «Записал», ни в «Успешно», ни в «Доход». Даже если удалили через несколько недель, она уходит из статистики.</p>",
"<p><b>Satış statistikasında</b> yalnız satış agentlərinin və adminlərin yazdığı qəbullar var; mütəxəssislərin özlərinin yazdığı qəbullar oraya düşmür, amma Pul statistikasında sayılır.</p>":"<p>В <b>статистике продаж</b> только записи агентов продаж и админов; записи, сделанные самими специалистами, туда не попадают, но считаются в денежной статистике.</p>",
"<p><b>Kopyala</b> — cədvəli WhatsApp üçün mətn kimi kopyalayır. WhatsApp-da yapışdırın, cədvəl sütunlarla görünəcək. «Bütün … kopyala» hər üç cədvəli birlikdə kopyalayır.</p>":"<p><b>Копировать</b> — копирует таблицу текстом для WhatsApp. Вставьте в WhatsApp — таблица будет со столбцами. «Копировать всю …» копирует все три таблицы вместе.</p>",

"<p><b>Yazdı / Yazılıb</b> — həmin günlərdə neçə pasiyent yazılıb. Qəbulun hansı günə olması fərq etmir: 11 noyabrda 22 noyabra yazılıbsa, 11 noyabrın həftəsinə düşür.</p>":"<p><b>Записал / Записано</b> — сколько пациентов записали в эти дни. Неважно, на какой день приём: если 11 ноября записали на 22 ноября, это идёт в неделю 11 ноября.</p>",
"<p><b>Uğurlu</b> — həmin günlərdə seansa gələnlər. Pasiyent gəlməyibsə, onu təqvimdən silirlər; gün bitəndə (23:59) təqvimdə qalanların hamısı uğurlu sayılır.</p>":"<p><b>Успешно</b> — кто пришёл на сеанс в эти дни. Если пациент не пришёл, его удаляют из календаря; в конце дня (23:59) все оставшиеся в календаре считаются успешными.</p>",
"<p><b>Qazanc</b> — uğurlu seansların pulu. <b>Məhsul</b> — kim neçə məhsul satıb və neçə manatlıq.</p>":"<p><b>Доход</b> — деньги за успешные сеансы. <b>Товары</b> — кто сколько товаров продал и на сколько манат.</p>",
"<p>Silinən qəbullar heç yerdə sayılmır. Həftə cümə başlayır, cümə axşamı bitir. Bu günün məlumatı həftəlik və aylıq cədvələ gecə 23:59-dan sonra düşür.</p>":"<p>Удалённые записи нигде не считаются. Неделя начинается в пятницу и заканчивается в четверг. Данные сегодняшнего дня попадают в недельную и месячную таблицы после 23:59.</p>",

function refresh(){

  var my=++seq,g=writes,from=state.loadedFrom||winFrom(),needHist=false;
  return Promise.all([
    fetchAll(function(){return sb.from("readers").select("*").order("created_at").order("id")}),
    fetchAll(function(){return sb.from("appts").select("*").gte("date",from).order("date",{ascending:false}).order("id")}),
    Promise.resolve([]),   /* services: no longer used */
    soft(function(){return sb.from("expenses").select("*").gte("date",from).order("date",{ascending:false}).order("id")}),
    soft(function(){return sb.from("staff").select("*").order("id")}),
    soft(function(){return sb.from("breaks").select("*").order("start_time")}),
    soft(function(){return sb.from("product_sales").select("*").gte("date",from).order("date",{ascending:false}).order("id")}),
    probe("appts.duration",function(){return soft(function(){return sb.from("appts").select("duration").limit(1)})}),
    probe("staff.role",function(){return soft(function(){return sb.from("staff").select("role").limit(1)})}),
    needHist?soft(function(){return sb.from("appts").select("id,reader_id,date,name,phone,status,created_by").gte("date",addDays(today,-400)).lt("date",from).order("date",{ascending:false}).order("id")}):Promise.resolve(null),
    probe("appts.updated_at",function(){return soft(function(){return sb.from("appts").select("updated_at").limit(1)})}),
    probe("audit_log.id",function(){return soft(function(){return sb.from("audit_log").select("id").limit(1)})}),
    probe("readers.color",function(){return soft(function(){return sb.from("readers").select("color").limit(1)})})

    if(my!==seq||!auth.user)return;

    if(pending||g!==writes){clearTimeout(rtTimer);rtTimer=setTimeout(refresh,700);return}
    lastFull=Date.now();state.loadedFrom=from;state.hasUpd=!!res[10];state.hasAudit=!!res[11];state.hasColor=!!res[12];
    res[1]=uniq(res[1]);

    state.breaks=(res[5]||[]).map(mapBreak);

    state.v2=!!(res[2]&&res[3]&&res[4]);

    state.staff={};state.roles={};state.roleSet={};(res[4]||[]).forEach(function(x){state.staff[x.id]=x.name||"";state.roles[x.id]=x.role||"agent";if(x.role)state.roleSet[x.id]=1});
    state.hasRole=!!res[8];
    if(!auth.filterInit){auth.filterInit=true;
      if(isSpec(auth.user.id)){var mine=activeReaders().filter(function(r){return r.name===state.staff[auth.user.id]})[0];if(mine&&!ui.sel.length)ui.sel=[mine.id]}}
    cleanSel();

    if(isOwner()&&state.hasRole&&state.staff[ADMIN]&&state.roles[ADMIN]!=="admin"&&!auth.fixed){
      /* The owner is never asked who they are: the role is set quietly. */
      auth.fixed=true;state.roles[ADMIN]="admin";state.roleSet[ADMIN]=1;
      sb.from("staff").update({role:"admin"}).eq("id",ADMIN).then(function(){},function(){});

  },function(){
    if(my!==seq)return;
    flash(offline?L("İnternet yoxdur."):L("Qəbulları yükləmək olmadı. İnterneti yoxlayın."));

function uniq(rows){var seen={};return rows.filter(function(x){if(seen[x.id])return false;seen[x.id]=1;return true})}
/* Safety net for a realtime line that died without saying so: every few minutes ask only for rows changed

function catchUp(){if(state.hasUpd&&auth.loaded&&Date.now()-lastFull<6*3600000)poll();else refresh()}
function cnt(t,from){var q=sb.from(t).select("id",{count:"exact",head:true});return from?q.gte("date",from):q}
function poll(){
  if(!sb||!auth.user||!auth.loaded||!state.hasUpd||pending||offline)return;
  var my=seq,g=writes,from=state.loadedFrom;
  Promise.all([
    maxUpd?sb.from("appts").select("*").gt("updated_at",new Date(maxUpd-90000).toISOString()).limit(500):Promise.resolve({data:[]}),
    sb.from("appts").select("id",{count:"exact",head:true}).gte("date",from),
    cnt("readers"),cnt("staff"),state.hasBreaks?cnt("breaks"):null,state.v2?cnt("expenses",from):null,state.hasProducts?cnt("product_sales",from):null
  ]).then(function(res){
    if(my!==seq||g!==writes||pending||!auth.user||res[0].error||res[1].error)return;
    /* Specialists, staff, breaks, expenses and product sales: a different number of rows means something was added or removed. */
    var have=[state.readers.length,Object.keys(state.staff).length,state.breaks.length,
      state.expenses.filter(function(x){return x.date>=from}).length,state.products.filter(function(x){return x.date>=from}).length];
    for(var i=0;i<5;i++){var c=res[2+i];if(c&&!c.error&&typeof c.count==="number"&&c.count!==have[i]){refresh();return}}
    var rows=res[0].data||[],ch=false;
    if(rows.length>=500){refresh();return}
    rows.forEach(function(x){var o=appt(x.id),u=x.updated_at?+new Date(x.updated_at):0;if(!o||o.upd!==u){upsertBy(state.appts,mapAppt(x));ch=true}});
    var local=state.appts.filter(function(a){return a.date>=from}).length;
    if(typeof res[1].count==="number"&&res[1].count!==local){refresh();return}
    if(ch){render();redrawCard()}
  },function(){});
}
function checkSecurity(){
  /* Owner only: warn if the database still lets strangers create an account for themselves. */
  if(!window.fetch||location.protocol==="file:")return;
  fetch(SB_URL+"/auth/v1/settings",{headers:{apikey:SB_KEY}}).then(function(r){return r.ok?r.json():null}).then(function(j){
    if(!j)return;var w=[];
    if(j.disable_signup===false)w.push(L("kənar adam özü hesab yarada bilir («Allow new users to sign up» açıqdır)"));
    if(j.external&&j.external.anonymous_users===true)w.push(L("anonim giriş açıqdır («Allow anonymous sign-ins»)"));
    secWarn=w.join("; ");if(secWarn)render();
  }).catch(function(){});
}

function pushWidget(){

  else{

      d[k]=LN.slice(0,4).map(function(a){var e=mins(a.time)+(a.dur||90);return [cut(String(a.name),24),rcolor(a.readerId),done(a)?"p":a.status==="noshow"?"n":"",e===e?e:-1]});

/* Full data is kept on the phone from a week before the 1st of last month, so this month's and last month's

function winFrom(){var t=parse(today),a=addDays(ymd(t.getFullYear(),t.getMonth()-1,1),-7),b=addDays(today,-WINDOW);return a<b?a:b}

  loadingOlder=true;var to=state.loadedFrom,my=seq;

    state.v2?soft(function(){return sb.from("expenses").select("*").gte("date",need).lt("date",to).order("date").order("id")}):Promise.resolve([]),
    state.hasProducts?soft(function(){return sb.from("product_sales").select("*").gte("date",need).lt("date",to).order("date").order("id")}):Promise.resolve([])

function onChange(pl){
  var t=pl.table,del=pl.eventType==="DELETE",row=del?pl.old:pl.new;
  if(!row||!row.id){clearTimeout(rtTimer);rtTimer=setTimeout(refresh,500);return}
  if(t==="appts"){if(del){removeBy(state.appts,row.id);removeBy(state.hist||[],row.id)}else upsertBy(state.appts,mapAppt(row))}
  else if(t==="expenses"){if(del)removeBy(state.expenses,row.id);else upsertBy(state.expenses,mapExp(row))}
  else if(t==="product_sales"){if(del)removeBy(state.products,row.id);else upsertBy(state.products,mapProd(row))}
  else if(t==="readers"&&!del&&row.name!=null){upsertBy(state.readers,mapReader(row))}
  else if(t==="breaks"&&!del&&row.start_time!=null){upsertBy(state.breaks,mapBreak(row));state.breaks.sort(function(x,y){return mins(x.start)-mins(y.start)})}
  else if(t==="breaks"&&del){removeBy(state.breaks,row.id)}
  else{clearTimeout(rtTimer);rtTimer=setTimeout(refresh,500);return}
  clearTimeout(rtRender);rtRender=setTimeout(function(){render();redrawCard()},120);
}
function startSync(){
  refresh();

  try{
    rt=sb.channel("all").on("postgres_changes",{event:"*",schema:"public"},onChange).subscribe(function(st){
      if(st==="SUBSCRIBED"){if(rtDown){rtDown=false;catchUp()}}
      else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED")rtDown=true;
    });
  }catch(e){rt=null}
}
function stopSync(){

    var k=pkey(a),p=m[k]||(m[k]={key:k,name:a.name,phone:a.phone,paid:0,noshow:0,cancel:0,wait:0,last:"",first:"",list:[]});

/* The whole number with its operator prefix, short enough for a calendar block: Azerbaijani numbers as
   "055 995 77 76" (also when written as +994…), anything else exactly as typed. */
function phoneShort(p){
  var d=String(p||"").replace(/\D/g,"");
  if(d.length===12&&d.indexOf("994")===0)d="0"+d.slice(3);
  else if(d.length===9&&d.charAt(0)!=="0")d="0"+d;
  if(d.length===10&&d.charAt(0)==="0")return d.slice(0,3)+" "+d.slice(3,6)+" "+d.slice(6,8)+" "+d.slice(8);
  return String(p||"");
}
function waLink(phone,text){
  var d=String(phone||"").replace(/\D/g,"");
  if(d.slice(0,2)==="00")d=d.slice(2);
  if(d.length===10&&d.charAt(0)==="0")d="994"+d.slice(1);
  else if(d.length===9)d="994"+d;
  else if(d.length===11&&d.charAt(0)==="8")d="7"+d.slice(1);
  else if(d.length===10&&d.charAt(0)==="9")d="7"+d;
  if(d.length<11)return "";
  return "https://wa.me/"+d+(text?"?text="+encodeURIComponent(text):"");
}

function isSpec(uid){return state.roles[uid]==="specialist"}

/* ---------- Statistics: everything on one page, nothing to open ----------
   1) bookings made today (live), 2) weekly and 3) monthly sales, money and product tables.
   A week is Friday–Thursday. The page shows the last FINISHED week: it changes on Thursday at 23:59, so from
   Friday 13 November to Thursday 19 November it shows 6–12 November, and from 19 November 23:59 it shows 13–19.
   A month runs from its first Friday to the Thursday before the next month's first Friday, so no day is ever
   left out: 4 weeks, or 5 when the month has five Fridays. October = 2 Oct – 5 Nov, November = 6 Nov – 3 Dec,
   December = 4 Dec – 31 Dec 2026, January = 1 Jan – 4 Feb 2027. The last finished month is shown, so October
   stays on screen until 3 December 23:59. */
var ST_START="2026-11-06";       /* first week of the app */
var ST_FIRSTM=[2026,9];          /* first month that can be shown: October 2026 */
function dDiff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function friOf(d){return addDays(d,-((parse(d).getDay()-5+7)%7))}
function thuOf(d){return addDays(d,-((parse(d).getDay()-4+7)%7))}
function weekRange(o){
  var y=addDays(today,-1),last=addDays(thuOf(y),-6),first=ST_START,off=Math.max(0,(o==null?ui.stOff:o)|0);
  if(last<first){var e0=addDays(first,6);return{s:first,e:e0,end:y<e0?y:e0,full:false,canBack:false,canFwd:false,next:e0}}
  var s1=addDays(last,-7*off);if(s1<first)s1=first;
  var e=addDays(s1,6);
  return{s:s1,e:e,end:e,full:true,canBack:s1>first,canFwd:s1<last,next:addDays(last,13)};
}
function tf(t,o){return t.replace(/\{(\w+)\}/g,function(_,k){return o[k]})}
function firstFri(y,m){var d=ymd(y,m,1);return addDays(d,(5-parse(d).getDay()+7)%7)}
function monthBlock(y,m){
  if(m<0){y--;m+=12}if(m>11){y++;m-=12}
  var nf=firstFri(m===11?y+1:y,(m+1)%12),st=firstFri(y,m);
  return{y:y,m:m,s:st,e:addDays(nf,-1),end:addDays(nf,-1),full:true,weeks:dDiff(st,nf)/7,name:cap(MONN[m])+" "+y};
}
function monthRange(o){
  var yd=addDays(today,-1),t=parse(today),b=monthBlock(t.getFullYear(),t.getMonth());
  while(b.e>yd)b=monthBlock(b.y,b.m-1);
  var latest=b,off=Math.max(0,(o==null?ui.stMOff:o)|0);
  for(var i=0;i<off;i++){var pb=monthBlock(b.y,b.m-1);if(pb.y*12+pb.m<ST_FIRSTM[0]*12+ST_FIRSTM[1])break;b=pb}
  var prev=monthBlock(b.y,b.m-1);
  b.canBack=prev.y*12+prev.m>=ST_FIRSTM[0]*12+ST_FIRSTM[1];b.canFwd=b.s<latest.s;
  b.nextB=monthBlock(latest.y,latest.m+1);
  return b;
}
function isAgent(k){return state.roles[k]==="agent"}
/* Rows for one table. kind: today | sales | money | prod. a, b, c are the table's number columns. */
function statData(kind,r){
  var rows={},order=[],T={a:0,b:0,c:0};
  function row(k,name){if(!rows[k]){rows[k]={name:name,a:0,b:0,c:0};order.push(k)}return rows[k]}
  var who=function(k){return state.staff[k]||L("Adsız")};
  if(kind==="money")activeReaders().forEach(function(x){row(x.id,x.name)});
  else Object.keys(state.staff).filter(isAgent).sort(function(x,y){return String(who(x)).localeCompare(String(who(y)))}).forEach(function(k){row(k,who(k))});
  if(kind==="prod"){
    state.products.forEach(function(x){if(x.date<r.s||x.date>r.end)return;var w=row(x.by||"-",who(x.by));w.a++;w.c+=x.amount;T.a++;T.c+=x.amount});
  }else state.appts.forEach(function(a){
    if(kind==="today"){if(a.created!==today||a.date<today||isSpec(a.by))return;   /* written today for today or later; bookings put into past days are not counted here */row(a.by||"-",who(a.by)).a++;T.a++;return}
    var inB=a.created&&a.created>=r.s&&a.created<=r.end,inS=a.date>=r.s&&a.date<=r.end&&done(a),x;
    if(!inB&&!inS)return;
    if(kind==="sales"){if(isSpec(a.by))return;x=row(a.by||"-",who(a.by))}
    else{var rd=reader(a.readerId);x=row(a.readerId,rd?rd.name:"—")}
    if(inB){x.a++;T.a++}
    if(inS){x.b++;T.b++;x.c+=a.price;T.c+=a.price}
  });
  return{rows:order.map(function(k){return rows[k]}),T:T};
}
var ST_KINDS={
  today:{t:function(){return L("Bu gün yazılan qəbullar")},h:function(){return [L("Kim yazıb"),L("Qəbul")]},c:function(x){return [x.name,String(x.a)]}},
  sales:{t:function(){return L("Satış statistikası")},h:function(){return [L("Satış agenti"),L("Yazdı"),L("Uğurlu")]},c:function(x){return [x.name,String(x.a),String(x.b)]}},
  money:{t:function(){return L("Pul statistikası")},h:function(){return [L("Mütəxəssis"),L("Yazılıb"),L("Uğurlu"),L("Qazanc")]},c:function(x){return [x.name,String(x.a),String(x.b),money(x.c)]}},
  prod:{t:function(){return L("Məhsul statistikası")},h:function(){return [L("Satan"),L("Satış"),L("Məbləğ")]},c:function(x){return [x.name,String(x.a),money(x.c)]}}
};

function statTable(kind,r,per){

  return h;
}

  if(!auth.loaded)return "";
  var w=weekRange(),m=monthRange(),h="",ex=function(d){return fmtDay(d)};

function clen(s){return String(s).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,"_").length}
/* One table as text for WhatsApp: a monospaced block keeps the columns straight, like a small Excel sheet. */
function statText(kind,r,per){
  var K=ST_KINDS[kind],d=statData(kind,r),hd=K.h(),rows=[hd].concat(d.rows.map(K.c)).concat([K.c({name:L("Cəmi"),a:d.T.a,b:d.T.b,c:d.T.c})]);
  var w=hd.map(function(_,i){return rows.reduce(function(m,x){return Math.max(m,clen(x[i]))},0)});
  var pad=function(s,n,right){var k=n-clen(s),sp=k>0?new Array(k+1).join(" "):"";return right?sp+s:s+sp};
  var line=function(x){return x.map(function(c,i){return pad(c,w[i],i>0)}).join(" | ")};
  var sep=w.map(function(n){return new Array(n+1).join("-")}).join("-+-");
  var head=per==="today"?K.t()+" — "+fmtDay(today,"y"):K.t()+" — "+(per==="month"?L("aylıq")+" ("+r.name+")":L("həftəlik"))+"\n"+rangeLabel(r)+(r.full?"":L(" (həftə hələ bitməyib)"));
  var out=[head,"```",line(rows[0]),sep];
  rows.slice(1,-1).forEach(function(x){out.push(line(x))});
  out.push(sep,line(rows[rows.length-1]),"```");
  return out.join("\n");
}
function statCopyText(kind,per){
  if(per==="today")return statText("today",{s:today,end:today},"today");
  var r=per==="month"?monthRange():weekRange();
  var ks=kind==="all"?["sales","money"].concat(state.hasProducts?["prod"]:[]):[kind];
  return ks.map(function(k){return statText(k,r,per)}).join("\n\n");
}

function copyText(t,ok,no){
  var done1=false;
  try{var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,t.length)}catch(e){}
    done1=document.execCommand("copy");document.body.removeChild(ta)}catch(e){}
  if(done1){ok();return}
  try{navigator.clipboard.writeText(t).then(ok,no)}catch(e){no()}
}

function auditLine(x){
  var o=x.old||{},n=x.new||{},T=x.tbl,op=x.op,v=op==="DELETE"?o:n;
  var verb=op==="INSERT"?L("əlavə etdi"):op==="DELETE"?L("SİLDİ"):L("dəyişdi");

  if(T==="appts"){
    if(op==="INSERT")return L("Qəbul yazdı: ")+ap(n);
    if(op==="DELETE")return L("Qəbulu SİLDİ: ")+ap(o)+(o.status&&o.status!=="wait"?" ("+stName(o.status)+")":"");
    var ch=[];
    if(o.status!==n.status)ch.push(L("status: ")+stName(o.status)+" → "+stName(n.status));
    if(+o.price!==+n.price)ch.push(L("qiymət: ")+money(o.price)+" → "+money(n.price));
    if(o.date!==n.date||String(o.time).slice(0,5)!==String(n.time).slice(0,5))ch.push(L("vaxt: ")+fd(o.date)+" "+String(o.time||"").slice(0,5)+" → "+fd(n.date)+" "+String(n.time||"").slice(0,5));
    if(o.reader_id!==n.reader_id)ch.push(L("mütəxəssis: ")+rn(o.reader_id)+" → "+rn(n.reader_id));
    if(o.name!==n.name)ch.push(L("ad: ")+(o.name||"")+" → "+(n.name||""));
    if((o.phone||"")!==(n.phone||""))ch.push(L("telefon: ")+(o.phone||"—")+" → "+(n.phone||"—"));
    if(+o.duration!==+n.duration)ch.push(L("müddət: ")+(+o.duration||90)+" → "+(+n.duration||90)+L(" dəq"));
    if((o.note||"")!==(n.note||""))ch.push(L("qeyd"));
    return L("Qəbul (")+[n.name||"",fd(n.date)].join(", ")+"): "+(ch.join("; ")||L("dəyişdi"));
  }
  if(T==="expenses")return L("Xərci ")+verb+": "+(v.title||"")+", "+money(v.amount)+(op==="UPDATE"&&+o.amount!==+n.amount?L(" (əvvəl ")+money(o.amount)+")":"");
  if(T==="product_sales")return L("Məhsul satışını ")+verb+": "+money(v.amount)+", "+fd(v.date);
  if(T==="readers"&&op==="UPDATE"&&o.color!==n.color&&o.name===n.name&&!!o.archived===!!n.archived)return L("Mütəxəssisin rəngini dəyişdi: ")+(n.name||"");
  if(T==="readers")return L("Mütəxəssisi ")+(op==="UPDATE"&&n.archived&&!o.archived?L("siyahıdan çıxardı"):verb)+": "+(v.name||"");
  if(T==="breaks")return L("Fasiləni ")+verb+": "+(v.title||"");
  if(T==="staff")return L("İşçi profili (")+verb+"): "+(v.name||"")+(v.role?", "+(v.role==="admin"?"admin":v.role==="specialist"?L("mütəxəssis"):L("satış agenti")):"");
  return T+" "+op;
}

function saveAppt(){
  if(!sheet)return;
  var rid=val("f-reader"),date=val("f-date"),time=val("f-time").slice(0,5),name=val("f-name"),phone=val("f-phone"),pr=amount("f-price"),price=pr===""?0:pr,note=val("f-note"),status="";
  var r=reader(rid),service="";
  if(!rid||!r)return fail("f-err",L("Mütəxəssisi seçmək vacibdir. Mütəxəssis olmadan qəbul yadda saxlanmır."));
  if(!date)return fail("f-err",L("Tarixi seçmək vacibdir. Tarix olmadan qəbul yadda saxlanmır."));
  if(!okDate(date))return fail("f-err",L("Tarixi düzgün seçin."));
  if(!/^\d{2}:\d{2}$/.test(time))return fail("f-err",L("Saatı seçmək vacibdir. Saat olmadan qəbul yadda saxlanmır."));
  if(state.hasDur&&!(+val("f-dur")>0))return fail("f-err",L("Müddəti seçmək vacibdir. Müddət olmadan qəbul yadda saxlanmır."));
  if(state.hasDur&&+val("f-dur")<MIN_DUR)return fail("f-err",L("Seans ən az 45 dəqiqə olmalıdır. Müddəti dəyişin."));
  if(!name)return fail("f-err",L("Pasiyentin adını yazmaq vacibdir. Ad olmadan qəbul yadda saxlanmır."));
  if(!phone)return fail("f-err",L("Pasiyentin mobil nömrəsini yazmaq vacibdir. Nömrə olmadan qəbul yadda saxlanmır."));
  var pd=phone.replace(/\D/g,"");
  if(pd.length<9||pd.length>15||/[^\d\s+()\-.]/.test(phone))return fail("f-err",L("Mobil nömrəni düzgün yazın, məsələn: 050 123 45 67 və ya +994 50 123 45 67."));
  if(pr==="")return fail("f-err",L("Qiyməti yazmaq vacibdir. Pul yazılmadan qəbul yadda saxlanmır."));
  if(isNaN(price)||price<0||price>MAXSUM)return fail("f-err",L("Qiyməti düzgün yazın: yalnız rəqəm, məsələn 150 və ya 12,5."));
  if(!(price>0))return fail("f-err",L("Qiymət 0 ola bilməz. Seansın pulunu yazın."));
  var a=sheet.id?appt(sheet.id):null;
  if(sheet.id&&!a){closeSheet();flash(L("Bu qəbul artıq silinib."));return}
  var dur=+(val("f-dur")||(a?a.dur:90))||90;
  if(mins(time)<DAY0||mins(time)+dur>DAY1)return fail("f-err",L("Seans 08:00 ilə 00:00 arasında olmalıdır. Başlama saatını və ya müddəti dəyişin."));
  /* A booking whose time is not being changed is not re-checked: a phone number can always be corrected,
     even if a break was added later or the booking was made before the overlap rule. */
  var moved=!a||a.readerId!==rid||a.date!==date||a.time!==time||(a.dur||90)!==dur||(a.status==="cancel"&&status&&status!=="cancel");
  var clash=status==="cancel"||!moved?null:overlap(rid,date,time,dur,sheet.id);
  if(clash)return fail("f-err",r.name+L(" bu vaxt məşğuldur: ")+clash.name+", "+clash.time+"–"+endOf(clash)+L(". Başqa vaxt seçin."));
  var br=status==="cancel"||!moved?null:inBreak(time,dur);
  if(br)return fail("f-err",L("Bu vaxt fasilədir: ")+br.title+" "+br.start+"–"+br.end+".");
  if(a){
    a.readerId=rid;a.date=date;a.time=time;a.name=name;a.phone=phone;a.price=price;a.note=note;a.dur=dur;
    var up={reader_id:rid,date:date,time:time,name:name,phone:phone,price:price,share:0,note:note};
    if(state.hasDur)up.duration=dur;
    if(ST[status]){a.status=status;up.status=status}
    if(service){a.service=service;up.service=service}
    db(sb.from("appts").update(up).eq("id",a.id));
  }else{
    var id=uuid();
    state.appts.push({id:id,readerId:rid,date:date,time:time,name:name,phone:phone,price:price,share:0,status:"wait",note:note,settled:false,service:service||"Ruqya",by:auth.user.id,dur:dur,created:bk().d});
    var ins={id:id,reader_id:rid,date:date,time:time,name:name,phone:phone,price:price,share:0,status:"wait",note:note};
    if(service)ins.service=service;
    if(state.hasDur)ins.duration=dur;
    db(sb.from("appts").insert(ins));
  }
  if(!a||sheet.from!=="np"){ui.date=date;ui.tab="day"}
  if(!shown(rid)){ui.sel.push(rid);if(ui.sel.length>=activeReaders().length)ui.sel=[];saveSel()}
  closeSheet();render();
}
function saveReader(){
  if(!sheet||!isAdmin())return;
  var name=val("r-name");
  if(!name)return fail("r-err",L("Mütəxəssisin adını yazın."));
  /* Specialists' own accounts are linked to the calendar by name, so two active specialists may not share one. */
  if(activeReaders().some(function(x){return x.id!==sheet.id&&low(x.name)===low(name)}))return fail("r-err",L("Bu adda mütəxəssis artıq var. Fərqli ad yazın (məsələn, soyadı ilə)."));
  if(sheet.id){
    var r=reader(sheet.id);
    if(r)r.name=name;
    db(sb.from("readers").update({name:name}).eq("id",sheet.id));
  }else{
    var id=uuid();
    state.readers.push({id:id,name:name,price:0,share:0,archived:false});
    db(sb.from("readers").insert({id:id,name:name,price:0,share:0}));
  }
  closeSheet();render();
}

/* ---------- events ---------- */
/* No emoji in anything people type (names, notes, titles): the only mark in the app is the ✅ the app itself
   puts before successful sessions. An emoji is removed as soon as it is typed or pasted, with a message, and a
   form that still holds one (an old name) cannot be saved until it is taken out. */
var EMOJI=/[\uD83C-\uD83E][\uDC00-\uDFFF]|[\u2600-\u27BF\u2B00-\u2BFF\u2300-\u23FF\uFE0F\u200D\u20E3\u3030\u303D\u3297\u3299\u2122\u2139\u24C2\u2934\u2935\u25AA-\u25FE\u2190-\u21FF]/;
var EMOJI_G=new RegExp(EMOJI.source,"g");
function hasEmoji(t){return EMOJI.test(String(t||""))}
function emojiField(el){return el&&!el.readOnly&&el.id!=="q"&&(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&/^(text|tel|search|)$/.test(el.type||"")))}
function emojiMsg(where){
  var m=L("Emoji istifadəsi qadağandır. Zəhmət olmasa, emojisiz yazın.");
  var box=where&&where.closest&&where.closest("#sheet"),err=box?box.querySelector("p.err"):null;
  if(err){err.textContent=m;err.hidden=false}else flash(m);
}
document.addEventListener("input",function(e){
  var el=e.target;if(!emojiField(el)||!hasEmoji(el.value))return;
  var pos=el.selectionStart,before=el.value.length;
  el.value=el.value.replace(EMOJI_G,"");
  try{if(pos!=null){var np=Math.max(0,pos-(before-el.value.length));el.setSelectionRange(np,np)}}catch(err){}
  emojiMsg(el);
},true);
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest('[data-act^="save-"],[data-act="login"]');if(!b)return;
  var box=b.closest("#sheet")||byId("main"),fields=box?box.querySelectorAll("input,textarea"):[];
  for(var i=0;i<fields.length;i++)if(emojiField(fields[i])&&hasEmoji(fields[i].value)){
    e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    emojiMsg(fields[i]);try{fields[i].focus()}catch(err){}return;
  }
},true);

/* ---------- pinch to zoom the hours ---------- */
var pz=null;
function tdist(e){return Math.abs(e.touches[0].clientY-e.touches[1].clientY)}
document.addEventListener("touchstart",function(e){
  var c=e.target.closest&&e.target.closest("#cal");
  if(!ZOOM||!c||e.touches.length!==2){return}
  var body=c.querySelector(".cal-body"),head=c.querySelector(".cal-head");if(!body)return;
  var rc=c.getBoundingClientRect(),fy=(e.touches[0].clientY+e.touches[1].clientY)/2;
  var hh=head?head.offsetHeight:0,y=c.scrollTop+fy-rc.top-hh-10;   /* finger point, in px from 08:00 */
  pz={t:Date.now(),c:c,body:body,d0:Math.max(tdist(e),30),h0:PXM*60,raw:HOUR,k:1,fy:fy-rc.top,m:DAY0+y/PXM,hh:hh};
  body.classList.add("pinch");body.style.transformOrigin="0 "+(y+10)+"px";sw=null;
},{passive:true});
document.addEventListener("touchmove",function(e){
  if(!ZOOM){if(e.touches.length===2&&e.target.closest&&e.target.closest("#cal"))e.preventDefault();return}   /* no zooming the page either */
  if(!pz||e.touches.length!==2)return;
  if(Date.now()-pz.t>15000){endPinch();return}
  e.preventDefault();
  pz.raw=Math.max(HMIN,Math.min(HMAX,pz.h0*tdist(e)/pz.d0));
  var h=Math.max(curMinHour,pz.raw);pz.k=h/pz.h0;
  pz.body.style.transform="scaleY("+pz.k+")";
},{passive:false});
/* Safari's own pinch gesture must not zoom the page while the calendar is being pinched. */
document.addEventListener("gesturestart",function(e){if(e.target.closest&&e.target.closest("#cal"))e.preventDefault()},{passive:false});
function endPinch(){
  if(!pz)return;var p=pz;pz=null;
  p.body.style.transform="";p.body.classList.remove("pinch");
  var h=Math.round(p.raw);
  if(Math.abs(h-HOUR)>=2){HOUR=h;PXM=Math.max(HOUR,curMinHour)/60;try{localStorage.setItem("ruqya.hour",String(HOUR))}catch(e){}}
  render();   /* also draws anything that arrived while the fingers were down */
  var c=byId("cal");if(c)c.scrollTop=Math.max(0,(p.m-DAY0)*PXM+10+p.hh-p.fy);
}
document.addEventListener("touchend",function(e){if(pz&&e.touches.length<2)endPinch()},{passive:true});
document.addEventListener("touchcancel",function(){if(pz)endPinch()},{passive:true});
/* On a computer: Ctrl + mouse wheel over the calendar does the same. */
document.addEventListener("wheel",function(e){
  var c=e.ctrlKey&&e.target.closest&&e.target.closest("#cal");if(!c)return;
  e.preventDefault();if(!ZOOM)return;
  var rc=c.getBoundingClientRect(),head=c.querySelector(".cal-head"),hh=head?head.offsetHeight:0,fy=e.clientY-rc.top;
  var m=DAY0+(c.scrollTop+fy-hh-10)/PXM,base=Math.max(HOUR,curMinHour),h=Math.max(HMIN,Math.min(HMAX,Math.round(base*(e.deltaY<0?1.12:1/1.12))));
  if(h===HOUR||(h<curMinHour&&HOUR<=curMinHour))return;HOUR=h;PXM=Math.max(HOUR,curMinHour)/60;try{localStorage.setItem("ruqya.hour",String(HOUR))}catch(err){}
  render();c=byId("cal");if(c)c.scrollTop=Math.max(0,(m-DAY0)*PXM+10+hh-fy);
},{passive:false});
var sw=null,qTimer=null;
document.addEventListener("touchstart",function(e){var c=e.target.closest&&e.target.closest("#cal");sw=c&&e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY,c:c}:null},{passive:true});
document.addEventListener("touchend",function(e){
  if(!sw||!e.changedTouches.length||e.touches.length)return;
  var dx=e.changedTouches[0].clientX-sw.x,dy=e.changedTouches[0].clientY-sw.y,c=sw.c;sw=null;
  if(Math.abs(dx)<70||Math.abs(dy)>45||c.scrollWidth>c.clientWidth+2)return;
  ui.date=addDays(ui.date,dx<0?1:-1);render();
},{passive:true});
window.addEventListener("popstate",function(){
  /* Our own "back" after closing a sheet: if another sheet was opened meanwhile, keep it and give it its own history entry. */
  if(backing){backing=false;if(sheet){try{history.pushState({sheet:1},"")}catch(e){}}return}
  hideSheet();
});
window.addEventListener("offline",function(){offline=true;render()});
window.addEventListener("online",function(){offline=false;if(/^İnternet yoxdur/.test(auth.msg))auth.msg="";render();refresh()});
function rollDay(){
  var t=bk().d;if(t===today)return false;
  if(ui.date===today&&!sheet)ui.date=t;today=t;return true;
}
/* How many bookings are already counted: when a session ends, totals and ✓ marks change without anyone touching the app. */
var doneN=-1;
function doneCount(){var n=0;for(var i=0;i<state.appts.length;i++)if(done(state.appts[i]))n++;return n}
function tick(){
  var turned=rollDay();
  if(auth.user&&auth.loaded){var dn=doneCount();if(dn!==doneN){if(doneN>=0){turned=turned||!sheet;widgetSoon()}doneN=dn}}
  if(offline&&navigator.onLine!==false){offline=false;turned=true;refresh()}
  if(document.hidden)return;
  if(turned||(ui.tab==="day"&&ui.view==="grid"&&ui.date===today&&!sheet))render();
  if(offline)return;
  if(auth.user&&(rtDown||Date.now()-lastFull>60*60000))refresh();
  else if(ticks%3===2)poll();
  if(++ticks%10===1)checkUpdate();
}
var ticks=0;
document.addEventListener("visibilitychange",function(){
  if(document.hidden){hiddenAt=Date.now();if(pz)endPinch();return}
  var away=hiddenAt?Date.now()-hiddenAt:0;hiddenAt=0;
  if(rollDay())render();
  /* Back in the app: after a long break reload everything; after a short one ask only for what changed. */
  if(auth.user&&!offline&&away>30*60000)refresh();
  else if(auth.user&&!offline&&away>20000)catchUp();
  if(!offline)checkUpdate();
});
setInterval(tick,60000);
if(sb){
  sb.auth.onAuthStateChange(function(ev,sess){
    var was=auth.user&&auth.user.id,now=sess&&sess.user&&sess.user.id;
    auth.user=sess?sess.user:null;auth.ready=true;
    if(now&&now!==was){auth.msg="";setTimeout(startSync,0)}
    if(!now&&was){wLast="";if(NATIVE){try{NATIVE.setWidgetData('{"out":1,"l":"'+LANG+'"}');wLast='{"out":1,"l":"'+LANG+'"}'}catch(e){}}stopSync();hideSheet();auth.msg="";byId("main").innerHTML="";byId("top").innerHTML=""}
    render();
  });
  setTimeout(function(){if(!auth.ready){auth.ready=true;render()}},8000);
}else{auth.ready=true}
/* Opened from the widget: "#d=2026-11-14" shows that day, "#new=..." starts a booking. */
var wantNew=null;
window.ruqyaOpen=function(d,isNew){
  if(!okDate(d))d=today;
  if(sheet)hideSheet();
  ui.tab="day";ui.date=d;byId("top").innerHTML="";
  if(isNew){if(auth.loaded&&activeReaders().length)openSheet({type:"appt",id:null,pre:{date:d}});else wantNew=d}
  render();
};
(function(){var m=/^#(d|new)=(\d{4}-\d{2}-\d{2})?$/.exec(location.hash||"");if(!m)return;
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  var d=m[2]&&okDate(m[2])?m[2]:today;ui.tab="day";ui.date=d;if(m[1]==="new")wantNew=d})();
/* A page reloaded with a form open would otherwise leave the app on the next "close". */
try{if(history.state&&history.state.sheet)history.replaceState(null,"")}catch(e){}
render();
checkUpdate();
})();
