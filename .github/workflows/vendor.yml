name: Vendor libraries

# Copies the Supabase client into the repository so the app does not depend
# on a third-party CDN, which can be blocked in some countries.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Fetch supabase-js
        run: |
          mkdir -p vendor /tmp/sb
          cd /tmp/sb
          npm pack @supabase/supabase-js@2.45.4
          tar -xzf supabase-supabase-js-2.45.4.tgz
          cp package/dist/umd/supabase.js "$GITHUB_WORKSPACE/vendor/supabase-2.45.4.js"
          ls -la "$GITHUB_WORKSPACE/vendor"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Vendor supabase-js 2.45.4"
          git push
