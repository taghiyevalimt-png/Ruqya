name: APK release signing check

# Proves that the release build is signed with the given key and is not debuggable, using a throw-away key.
# Publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"
      - name: Build two release APKs with the same throw-away key
        working-directory: android
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/t.jks" -storetype JKS -alias t -keyalg RSA -keysize 2048 -validity 365 \
            -storepass testpass -keypass testpass -dname "CN=test" >/dev/null
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/t.jks" ANDROID_KEYSTORE_PASS=testpass ANDROID_KEY_ALIAS=t ANDROID_KEY_PASS=testpass
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/a.apk"
          GITHUB_RUN_NUMBER=99999 gradle clean assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/b.apk"
      - name: Check signature, same key on both, not debuggable
        shell: bash
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in a b; do "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/$f.apk" | grep "SHA-256" | tee "$RUNNER_TEMP/$f.cert"; done
          test -s "$RUNNER_TEMP/a.cert" || { echo "NO SIGNATURE"; exit 1; }
          diff "$RUNNER_TEMP/a.cert" "$RUNNER_TEMP/b.cert" || { echo "KEY MISMATCH"; exit 1; }
          echo "SAME KEY OK"
          if "$BT/aapt" dump badging "$RUNNER_TEMP/a.apk" | grep -q "application-debuggable"; then echo "DEBUGGABLE"; exit 1; else echo "NOT DEBUGGABLE OK"; fi
          "$BT/aapt" dump badging "$RUNNER_TEMP/a.apk" | head -3 || true
