name: Widget check

# Builds the app, starts Android emulators, draws the home-screen widget with
# sample data and keeps the pictures, and checks that opening the app from a
# widget tap does not crash.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [23, 33]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"
      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash android/test-widget.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: widget-${{ matrix.api }}
          path: |
            widget-*.png
            crash-*.txt
      - name: Keep the pictures on the "checks" branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp *.png crash-*.txt error-*.txt bind-*.txt /tmp/out/ 2>/dev/null || true
          git config user.name "widget-check" && git config user.email "widget-check@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git checkout --orphan checks-${{ matrix.api }}
            git rm -rq --cached . 2>/dev/null || true
            mkdir -p out-${{ matrix.api }} && cp /tmp/out/* out-${{ matrix.api }}/ 2>/dev/null || true
            git add out-${{ matrix.api }} && git commit -qm "widget check ${{ matrix.api }}" || true
            git push -f origin checks-${{ matrix.api }} && break
            sleep 5
          done
