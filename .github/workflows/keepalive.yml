name: Keep database awake

# The free database plan pauses a project that receives no requests for a week
# (for example over a holiday). One tiny read twice a week prevents that.
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions:
  actions: write
  contents: write   # A6-R1: the empty commit below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row with the public key
        # Since 2026-11-14 visitors without a sign-in may not read any table, so the answer is 401 with
        # PostgreSQL's own "permission denied" (42501). That answer comes from the database itself, so the
        # database was reached and stays awake; anything else (timeout, 5xx, paused project) is a failure.
        run: |
          code=$(curl -s -o body.json -w "%{http_code}" --max-time 30 \
            -H "apikey: sb_publishable_HgWeQpSVqGfOdPKOWkwUBg_L67kK0O7" \
            "https://ldkhdeehrrajvgrtieal.supabase.co/rest/v1/readers?select=id&limit=1")
          echo "status $code"; cat body.json; echo
          if [ "$code" = "200" ]; then exit 0; fi
          if [ "$code" = "401" ] && grep -q '"code":"42501"' body.json; then exit 0; fi
          exit 1
      - name: Keep this schedule switched on
        # GitHub switches off scheduled jobs in a repository with no new commits for 60 days.
        # Enabling the workflow again through the API resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # B-03: the nightly backup is switched off by the same 60-day rule, so it is switched on here too
          for wf in keepalive.yml backup.yml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/enable")
            echo "enable $wf: $code"; [ "$code" = "204" ] || { echo "::error::could not keep $wf switched on ($code)"; exit 1; }
          done
      - name: Empty commit when the repository has been quiet for 45 days
        # A6-R1 (23.11): GitHub's 60-day rule counts repository activity; whether enabling through the API resets it is not
        # documented. An empty commit (no file changes, so the site and the APK stay as they are) is activity for sure.
        # Runs at most once in 45 days, and only when nobody else committed in that time.
        run: |
          git init -q k && cd k
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin main && git checkout -q -B main FETCH_HEAD
          last=$(git log -1 --format=%ct); now=$(date +%s); days=$(( (now - last) / 86400 ))
          echo "last commit $days days ago"
          if [ "$days" -lt 45 ]; then exit 0; fi
          git -c user.name="keepalive" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --allow-empty -m "keepalive: no commits for $days days (A6-R1, GitHub switches schedules off after 60)"
          git push -q origin HEAD:main && echo "empty commit pushed"
