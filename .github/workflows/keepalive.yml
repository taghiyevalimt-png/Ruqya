name: Keep database awake

# The free database plan pauses a project that receives no requests for a week
# (for example over a holiday). One tiny read twice a week prevents that.
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row with the public key
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: sb_publishable_HgWeQpSVqGfOdPKOWkwUBg_L67kK0O7" \
            "https://ldkhdeehrrajvgrtieal.supabase.co/rest/v1/readers?select=id&limit=1")
          echo "status $code"
          test "$code" = "200"
      - name: Keep this schedule switched on
        # GitHub switches off scheduled jobs in a repository with no new commits for 60 days.
        # Enabling the workflow again through the API resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -o /dev/null -w "enable %{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
