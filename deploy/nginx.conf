# Mərkəz — static site on the customer's own server (S-01: headers GitHub Pages cannot send).
# Put the site files (index.html, manifest.webmanifest, version.txt, *.png, *.webp, vendor/, launch/) into
# /var/www/merkez — for another database first run: python3 tools/configure.py --env-file .env /var/www/merkez
# Replace merkez.example.az and the certificate paths. The database address in connect-src comes from index.html's
# own Content-Security-Policy (meta); the header below only adds what a meta tag cannot carry.
server {
    listen 80;
    server_name merkez.example.az;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;   # nginx 1.25.1+ may prefer "listen 443 ssl;" plus "http2 on;" (same effect)
    server_name merkez.example.az;
    ssl_certificate     /etc/ssl/merkez/fullchain.pem;
    ssl_certificate_key /etc/ssl/merkez/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/merkez;
    index index.html;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # the page and version.txt must never be served stale (the app checks version.txt to offer an update)
    location = /index.html  { add_header Cache-Control "no-cache"; include /etc/nginx/merkez-headers.conf; }
    location = /version.txt { add_header Cache-Control "no-store"; include /etc/nginx/merkez-headers.conf; }
    location /vendor/       { add_header Cache-Control "public, max-age=2592000, immutable"; include /etc/nginx/merkez-headers.conf; }
    location / { try_files $uri $uri/ =404; }
}
